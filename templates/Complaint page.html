<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complaint Filer</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body {
    margin: 0;
    padding: 0;
    font-family: "Nunito", sans-serif;
    background: #F0F2FF;
    min-height: 100vh;
}


.white-card {
    margin: 22px 16px 100px 16px;
}

.section-label {
    font-size: 12px;
    font-weight: 800;
    color: #AAAACC;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 4px 14px 4px;
}

.complaint-box {
    background: #fff;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 4px 18px rgba(108,100,255,0.10);
}

.complaint-box textarea {
    width: 100%;
    height: 150px;
    margin-bottom: 16px;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid #E0E0FF;
    font-family: "Nunito", sans-serif;
    font-size: 14px;
    outline: none;
    resize: none;
}

.complaint-box button {
    width: 100%;
    padding: 14px;
    border-radius: 18px;
    border: none;
    font-weight: 800;
    font-family: "Nunito", sans-serif;
    font-size: 15px;
    background: linear-gradient(135deg, #6C64FF 0%, #8B84FF 100%);
    color: white;
    cursor: pointer;
    transition: transform 0.15s ease;
}

.complaint-box button:active {
    transform: scale(0.96);
}




/* Textarea Box */

.top-area {
        background-color: #6C64FF;
    padding: 28px 24px 70px 24px;
    border-radius: 0 0 36px 36px;
}

.top-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.profile-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.greeting-text {
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    font-weight: 600;
    display: block;
    padding-left: 1cm;
}
</style>

</head>

<body>



    <!-- HEADER -->
    <!-- TOP HEADER -->
<div class="top-area">
    <div class="top-area">

    <!-- BACK BUTTON -->
    <a href="{{ url_for('profile') }}">
        <img src="{{ url_for('static', filename='Assets/images/back-button.png') }}"
             style="position:absolute; top:20px; left:18px; width:55px; cursor:pointer;">
    </a>

    <!-- TOP RIGHT CIRCLES -->
    <img src="{{ url_for('static', filename='Assets/images/Just-circles.png') }}"
         style="position:absolute; top:0; right:0; width:130px;">

    <div class="top-content">
        <div class="profile-row">
           
            <div>
                <span class="greeting-text">Help & Support</span>
                <span style="font-size:18px;font-weight:800;color:#fff;padding-left: 1cm;">
                    File Complaint
                </span>
            </div>
        </div>
    </div>

</div>  
</div>
   <div class="white-card">

    <p class="section-label" style="margin-top: 24px;">
        Complaint Details
    </p>

    <div class="complaint-box">

        <textarea id="complaintText" placeholder="Describe your issue..."></textarea>

        <button onclick="sendComplaint()">Submit Complaint</button>

    </div>

</div>
<script>
function sendComplaint(){

  const text = document.getElementById("complaintText").value;

  if(text.trim() === ""){
    alert("Please enter complaint");
    return;
  }

  fetch("/add_complaint", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify({ complaint:text })
  })
  .then(res => res.json())
  .then(data=>{
    if(data.success){
      alert("Complaint Submitted!");
      document.getElementById("complaintText").value="";
    }
  });

}
</script>
</body>
</html>
