<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complaint Filer</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body {
    margin: 0;
    padding: 0;
    font-family: "Nunito", sans-serif;
    background: #F0F2FF;
    min-height: 100vh;
}


.white-card {
    margin: 22px 16px 100px 16px;
}

.section-label {
    font-size: 12px;
    font-weight: 800;
    color: #AAAACC;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 4px 14px 4px;
}

.complaint-box {
    background: #fff;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 4px 18px rgba(108,100,255,0.10);
}

.complaint-box textarea {
    width: 100%;
    height: 150px;
    margin-bottom: 16px;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid #E0E0FF;
    font-family: "Nunito", sans-serif;
    font-size: 14px;
    outline: none;
    resize: none;
}

.complaint-box button {
    width: 100%;
    padding: 14px;
    border-radius: 18px;
    border: none;
    font-weight: 800;
    font-family: "Nunito", sans-serif;
    font-size: 15px;
    background: linear-gradient(135deg, #6C64FF 0%, #8B84FF 100%);
    color: white;
    cursor: pointer;
    transition: transform 0.15s ease;
}

.complaint-box button:active {
    transform: scale(0.96);
}




/* Textarea Box */

.top-area {
      background: linear-gradient(135deg, #6C64FF 0%, #8B84FF 100%);
    padding: 28px 24px 70px 24px;
    border-radius: 0 0 36px 36px;
}

.top-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-left: 80px;
      margin-top: 40px;
}

.profile-row {
    display: flex;
    align-items: center;
    gap: 12px;
}



.greeting-text {
  font-size: 16px;
  color: white;
  font-weight: 500;
}
.circle1 {
    position: absolute;
    width: 190px; height: 190px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    top: -55px; right: -45px;
}
.circle2 {
    position: absolute;
    width: 115px; height: 115px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    top: 45px; right: 25px;
}

.backbutton {
    position: absolute;
    top: 45px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 49px;
}

.backbutton img {
    width: 42px; height: 42px;
    object-fit: contain;
    display: block;
}

.bluebg {
    background: linear-gradient(135deg, #6C64FF 0%, #8B84FF 100%);
    height: 180px;
    width: 100%;
    position: relative;
    overflow: hidden;
}
.bluebg h1 {
    font-size: 22px;
    font-weight: 800;
    margin-top: 20px;
}
</style>

</head>

<body>



    <!-- HEADER -->
    <!-- TOP HEADER -->
<!-- TOP HEADER -->
<div class="bluebg">

  <!-- Circles -->
  <div class="circle1"></div>
  <div class="circle2"></div>

  <!-- Back Button -->
  <a href="{{ url_for('profile') }}" style="text-decoration:none;color:inherit;outline:none;-webkit-tap-highlight-color:transparent;">
    <div class="backbutton">
      <img src="{{ url_for('static', filename='Assets/images/back-button.png') }}">
    </div>
  </a>

  <!-- Content -->
  <div class="top-content">
    <div class="profile-row">
      <div>
        <span class="greeting-text">Help & Support</span>
        <p style="font-size:22px;font-weight:600;color:white;margin:5px 0 0 0;">
          File Complaint
        </p>
      </div>
    </div>
  </div>

</div>
</div>
   <div class="white-card">

    <p class="section-label" style="margin-top: 24px;">
        Complaint Details
    </p>

    <div class="complaint-box">

        <textarea id="complaintText" 
          placeholder="Describe your issue..."
          oninput="checkWordLimit()"></textarea>
        <p style="font-size:12px;color:gray;">
        Maximum 100 words allowed
        </p>
        <p id="wordCount" style="font-size:12px;color:#888;margin-bottom:10px;">
        0 / 100 words
        </p>

        <button onclick="sendComplaint()">Submit Complaint</button>

    </div>

</div>
<script>
function checkWordLimit(){
  const textarea = document.getElementById("complaintText");
  const words = textarea.value.trim().split(/\s+/);

  let wordCount = words[0] === "" ? 0 : words.length;

  if(wordCount > 100){
      textarea.value = words.slice(0,100).join(" ");
      wordCount = 100;
  }

  document.getElementById("wordCount").innerText =
  wordCount + " / 100 words";
}
function sendComplaint(){

  const text = document.getElementById("complaintText").value.trim();

  if(text === ""){
    alert("Please enter complaint");
    return;
  }

  // ✅ Word limit check
  const words = text.split(/\s+/);
  if(words.length > 100){
    alert("Complaint must be maximum 100 words");
    return;
  }

  fetch("/add_complaint", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify({ complaint:text })
  })
  .then(res => res.json())
  .then(data=>{
    if(data.success){
      alert("Complaint Submitted!");
      document.getElementById("complaintText").value="";
    }
  });

}
</script>
</body>
</html>
