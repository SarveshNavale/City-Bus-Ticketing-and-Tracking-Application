<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complaint Filer</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
    background:#e8e8ef;
    padding:15px;
    display:flex;
    justify-content:center;
    height: 800px;
}

.phone{
    width:100%;
    max-width:400px;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 0 6px rgba(0,0,0,0.15);
}

/* HEADER */
.header{
    background:#725bff;
    padding:25px;
    text-align:center;
    color:#fff;
    position:relative;
    height:140px;
}

.back{
    position:absolute;
    top:35px;
    left:16px;
    background:rgba(255,255,255,0.2);
    width:55px;
    height:55px;
    border-radius:50%;
    font-size:26px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-top:28px;
}

/* Three Rings */
.rings{
    position:absolute;
    right:22px;
    top:10px;
    width:120px;
    height:120px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.12);
}
.rings::before{
    content:"";
    position:absolute;
    width:90px;
    height:90px;
    top:15px;
    left:15px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.10);
}
.rings::after{
    content:"";
    position:absolute;
    width:65px;
    height:65px;
    top:28px;
    left:28px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.08);
}

/* CONTENT */
.content{
    padding:22px;
    margin-top:0px;
}

.label{
    font-size:17px;
    font-weight:bold;
    color:#444;
    margin-top: 10px;
}

/* Textarea Box */
.textbox{
    width:100%;
    height:250px;
    border:none;
    outline:none;
    border-radius:12px;
    padding:15px;
    font-size:16px;
    resize:none;
    background:#fff;
    box-shadow:0 0 8px rgba(0,0,0,0.15);
    margin-top:15px;
}

/* Send Button */
.send-btn{
    background:#725bff;
    color:#fff;
    border:none;
    padding:12px 35px;
    border-radius:20px;
    font-size:16px;
    float:right;
    margin-top:18px;
}
</style>

</head>

<body>

<div class="phone">

    <!-- HEADER -->
    <div class="header">
        <div class="back">‹</div>
        <div class="title">Complaint Filer</div>
        <div class="rings"></div>
    </div>

    <div class="content">

        <div class="label">Please Enter your Complaint</div>

        <textarea class="textbox"></textarea>

        <button class="send-btn">Send</button>

    </div>
</div>

</body>
</html>
