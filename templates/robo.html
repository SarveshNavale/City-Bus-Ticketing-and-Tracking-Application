<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@600&display=swap" rel="stylesheet">
<title>Tikko AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
    margin: 0;
    padding: 0;
    font-family: 'Hind Guntur';
}

.bluebg {
    background-color: #6C64FF;
    height: 220px;
    width: 100%;
    position: relative;
}

.backbutton {
    position: absolute;
    top: 45px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 49px;
}

.backbutton img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.topcircles {
    position: absolute;
    right: 5px;
    top: 0px;
}

#chatbox {
    width: 100%;
    height: calc(100vh - 340px - 95px); 
    overflow-y: auto;
    padding: 10px;
    box-sizing: border-box;
}

.sentmsg {
    max-width: 70%;
    background-color: #6C64FF;
    padding: 12px;
    border-radius: 14px;
    margin-left: auto;
    margin-bottom: 10px;
    color: white;
    font-size: 16px;
}

.recmsg {
    max-width: 70%;
    background-color: #f1f1f1;
    padding: 12px;
    border-radius: 14px;
    margin-right: auto;
    margin-bottom: 10px;
    color: #424242;
    font-size: 16px;
}

.recmsg.typing {
    font-style: italic;
    color: #888;
}

.inputarea {
    width: 100%;
    height: 100px;
    display: flex;
    align-items: center;
    padding: 0 15px;
    box-sizing: border-box;
    background-color: #ffffff;
    border-top: 1px solid #ccc;
    position: fixed;
    bottom: 15px;
    left: 0;
}

.input-container {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
}

input {
    flex: 1;
    height: 45px;
    border-radius: 22px;
    border: 1px solid #bababa;
    padding-left: 15px;
    font-size: 16px;
    outline: none;
    font-family: 'Hind Guntur';
}

.btn-group {
    display: flex;
    gap: 8px;
}

.sendbtn {
    background-color: #6C64FF;
    color: white;
    padding: 10px 20px;
    border-radius: 22px;
    font-size: 16px;
    border: none;
    font-family: 'Hind Guntur';
    cursor: pointer;
    white-space: nowrap;
}

.clearbtn {
    background-color: #ff6b6b;
    color: white;
    padding: 10px 20px;
    border-radius: 22px;
    font-size: 16px;
    border: none;
    font-family: 'Hind Guntur';
    cursor: pointer;
    white-space: nowrap;
}

.sendbtn:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
}

.clearbtn:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
}

.loading-dots {
    display: inline-block;
    width: 20px;
    text-align: left;
}

.loading-dots::after {
    content: '...';
    animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
}

/* Responsive adjustments */
@media (max-width: 600px) {
    .btn-group {
        flex-direction: column;
        gap: 5px;
    }
    
    .sendbtn, .clearbtn {
        padding: 8px 12px;
        font-size: 14px;
    }
    
    input {
        font-size: 14px;
    }
}

</style>

</head>

<body>

<div class="bluebg">

    <a href="/backtohome" style="display: block; text-decoration: none; color: inherit;">
    <div class="backbutton">
        <img src="static/Assets/images/back-button.png">
        <p style="font-size: 22px; font-weight:600; color:white;">TIKKO<br>ROBO</p>
    </div>
    </a>

    <div class="topcircles">
        <img src="static/Assets/images/Just-circles.png" style="width:150px;">
    </div>

</div>

<!-- Chat section -->
<div id="chatbox"></div>

<!-- input area -->
<div class="inputarea">
    <div class="input-container">
        <input id="userinput" type="text" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <div class="btn-group">
            <button class="clearbtn" onclick="clearChat()" id="clearBtn">Clear</button>
            <button class="sendbtn" onclick="sendMsg()" id="sendBtn">Send</button>
        </div>
    </div>
</div>
<script>
async function sendMsg() {
    const inputField = document.getElementById("userinput");
    const sendButton = document.getElementById("sendBtn");
    const clearButton = document.getElementById("clearBtn");
    
    let text = inputField.value.trim();
    
    if (text === "") return;
    
    inputField.value = "";
    inputField.disabled = true;
    sendButton.disabled = true;
    clearButton.disabled = true;
    
    const box = document.getElementById("chatbox");
    
    let sent = document.createElement("div");
    sent.className = "sentmsg";
    sent.innerText = text;
    box.appendChild(sent);
    
    let ai = document.createElement("div");
    ai.className = "recmsg typing";
    ai.id = "aiTyping";
    ai.innerText = "Thinking";
    const dotsSpan = document.createElement("span");
    dotsSpan.className = "loading-dots";
    ai.appendChild(dotsSpan);
    box.appendChild(ai);
    
    box.scrollTop = box.scrollHeight;
    
    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ message: text })
        });
        
        const data = await response.json();
        
        const typingElem = document.getElementById("aiTyping");
        if (typingElem) {
            typingElem.remove();
        }
        
        let responseDiv = document.createElement("div");
        responseDiv.className = "recmsg";
        responseDiv.innerText = data.response;
        box.appendChild(responseDiv);
        
    } catch (error) {
        console.error('Error:', error);
        
        const typingElem = document.getElementById("aiTyping");
        if (typingElem) {
            typingElem.remove();
        }
        
        let errorDiv = document.createElement("div");
        errorDiv.className = "recmsg";
        errorDiv.innerText = "Sorry, I encountered an error. Please try again.";
        box.appendChild(errorDiv);
    }
    
    inputField.disabled = false;
    sendButton.disabled = false;
    clearButton.disabled = false;
    inputField.focus();
    box.scrollTop = box.scrollHeight;
}
function handleKeyPress(event) {
    if (event.key === 'Enter') {
        sendMsg();
    }
}

function clearChat() {
    const box = document.getElementById("chatbox");
    
    if (box.children.length <= 1) {
        return; 
    }
    
    if (confirm("Clear the current conversation?")) {
        box.innerHTML = '';
        
        let welcome = document.createElement("div");
        welcome.className = "recmsg";
        welcome.innerText = "Hello! I'm Tikko Robo. How can I help you today?";
        box.appendChild(welcome);
        
        document.getElementById("userinput").focus();
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const box = document.getElementById("chatbox");
    
    let welcome = document.createElement("div");
    welcome.className = "recmsg";
    welcome.innerText = "Hello! I'm Tikko Robo. How can I help you today?";
    box.appendChild(welcome);
    
    document.getElementById("userinput").focus();
});
</script>

</body>
</html>
