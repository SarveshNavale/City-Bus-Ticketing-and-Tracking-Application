<!DOCTYPE html>
<html>
<head>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<title>Tikko AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root{
--blue:#6C64FF;
--white:#fff;
--card-bg:#f2f2f2;
--text:#333;
--radius:14px;
--shadow:0 10px 18px rgba(0,0,0,0.12);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Nunito",sans-serif;
background:#fff;
color:var(--text);
}

/* HEADER */
.bluebg{
background:linear-gradient(135deg,#6C64FF 0%,#8B84FF 100%);
height:180px;
width:100%;
position:relative;
overflow:hidden;
}

.circle1{
position:absolute;
width:190px;
height:190px;
border-radius:50%;
background:rgba(255,255,255,0.10);
top:-55px;
right:-45px;
}

.circle2{
position:absolute;
width:115px;
height:115px;
border-radius:50%;
background:rgba(255,255,255,0.07);
top:45px;
right:25px;
}

.backbutton{
position:absolute;
top:45px;
left:20px;
display:flex;
align-items:center;
gap:20px;
}

.backbutton img{
width:60px;
height:60px;
object-fit:contain;
}

/* CHAT AREA */
#chatbox{
width:100%;
height:calc(100vh - 260px);
overflow-y:auto;
padding:15px;
}

/* MESSAGES */
.sentmsg{
max-width:75%;
background:var(--blue);
padding:12px 14px;
border-radius:16px;
margin-left:auto;
margin-bottom:10px;
color:white;
font-size:15px;
box-shadow:var(--shadow);
}

.recmsg{
max-width:75%;
background:var(--card-bg);
padding:12px 14px;
border-radius:16px;
margin-right:auto;
margin-bottom:10px;
color:#444;
font-size:15px;
box-shadow:var(--shadow);
}

.recmsg.typing{
font-style:italic;
color:#888;
}

/* INPUT AREA */
.inputarea{
width:100%;
display:flex;
align-items:center;
padding:12px;
box-sizing:border-box;
background:var(--white);
position:fixed;
bottom:0;
left:0;
border-top:1px solid #eee;
}

.input-container{
flex:1;
display:flex;
align-items:center;
gap:10px;
}

input{
flex:1;
height:45px;
border-radius:25px;
border:1px solid #ccc;
padding:0 15px;
font-size:15px;
outline:none;
font-family:"Nunito";
}

/* BUTTONS */
.btn-group{
display:flex;
gap:8px;
}

.sendbtn{
background:var(--blue);
color:white;
padding:10px 18px;
border-radius:25px;
font-size:15px;
border:none;
cursor:pointer;
}

.clearbtn{
background:#ff6b6b;
color:white;
padding:10px 18px;
border-radius:25px;
font-size:15px;
border:none;
cursor:pointer;
}

.sendbtn:disabled,
.clearbtn:disabled{
background:#ccc;
cursor:not-allowed;
}

/* LOADING DOTS */
.loading-dots::after{
content:'...';
animation:dots 1.5s steps(4,end) infinite;
}

@keyframes dots{
0%,20%{content:'';}
40%{content:'.';}
60%{content:'..';}
80%,100%{content:'...';}
}

/* MOBILE */
@media (max-width:600px){
.sendbtn,.clearbtn{
padding:8px 12px;
font-size:14px;
}
}

</style>

</head>

<body>

<!-- HEADER -->
<div class="bluebg">

<div class="circle1"></div>
<div class="circle2"></div>

<a href="/backtohome" style="text-decoration:none;color:inherit;">
<div class="backbutton">
<img src="static/Assets/images/back-button.png">
<p style="font-size:22px;font-weight:600;color:white;">
TIKKO <br> ROBO
</p>
</div>
</a>

</div>

<!-- CHAT -->
<div id="chatbox"></div>

<!-- INPUT -->
<div class="inputarea">
<div class="input-container">
<input id="userinput" type="text" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
<div class="btn-group">
<button class="clearbtn" onclick="clearChat()" id="clearBtn">Clear</button>
<button class="sendbtn" onclick="sendMsg()" id="sendBtn">Send</button>
</div>
</div>
</div>
<script>
async function sendMsg() {
    const inputField = document.getElementById("userinput");
    const sendButton = document.getElementById("sendBtn");
    const clearButton = document.getElementById("clearBtn");

    let text = inputField.value.trim();

    if (text === "") return;

    inputField.value = "";
    inputField.disabled = true;
    sendButton.disabled = true;
    clearButton.disabled = true;

    const box = document.getElementById("chatbox");

    let sent = document.createElement("div");
    sent.className = "sentmsg";
    sent.innerText = text;
    box.appendChild(sent);

    let ai = document.createElement("div");
    ai.className = "recmsg typing";
    ai.id = "aiTyping";
    ai.innerText = "Thinking";

    const dotsSpan = document.createElement("span");
    dotsSpan.className = "loading-dots";
    ai.appendChild(dotsSpan);

    box.appendChild(ai);
    box.scrollTop = box.scrollHeight;

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ message: text })
        });

        const data = await response.json();

        const typingElem = document.getElementById("aiTyping");
        if (typingElem) {
            typingElem.remove();
        }

        let responseDiv = document.createElement("div");
        responseDiv.className = "recmsg";
        responseDiv.innerText = data.response;
        box.appendChild(responseDiv);

    } catch (error) {
        console.error('Error:', error);

        const typingElem = document.getElementById("aiTyping");
        if (typingElem) {
            typingElem.remove();
        }

        let errorDiv = document.createElement("div");
        errorDiv.className = "recmsg";
        errorDiv.innerText = "Sorry, I encountered an error. Please try again.";
        box.appendChild(errorDiv);
    }

    inputField.disabled = false;
    sendButton.disabled = false;
    clearButton.disabled = false;
    inputField.focus();
    box.scrollTop = box.scrollHeight;
}

function handleKeyPress(event) {
    if (event.key === 'Enter') {
        sendMsg();
    }
}

function clearChat() {
    const box = document.getElementById("chatbox");

    if (box.children.length <= 1) {
        return;
    }

    if (confirm("Clear the current conversation?")) {
        box.innerHTML = '';

        let welcome = document.createElement("div");
        welcome.className = "recmsg";
        welcome.innerText = "Hello! I'm Tikko Robo. How can I help you today?";
        box.appendChild(welcome);

        document.getElementById("userinput").focus();
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const box = document.getElementById("chatbox");

    let welcome = document.createElement("div");
    welcome.className = "recmsg";
    welcome.innerText = "Hello! I'm Tikko Robo. How can I help you today?";
    box.appendChild(welcome);

    document.getElementById("userinput").focus();
});
</script>
