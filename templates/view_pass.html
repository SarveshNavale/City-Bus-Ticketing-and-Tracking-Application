<!doctype html>
<html lang="mr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>View Pass</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --blue: #6C64FF;
      --page-bg: #111;
      --white: #fff;
      --card-bg: #f2f2f2;
      --text: #333;
      --radius: 14px;
      --card-shadow: 0 10px 18px rgba(0,0,0,0.12);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    
      body{
  background:#fff;         
  font-family:"Poppins",sans-serif;
  color:var(--text);
  margin:0;
}
    /* header */
    .bluebg {
    background-color: #6C64FF;
    height: 220px;
    width: 100%;
    position: relative;
}

.backbutton {
    position: absolute;
    top: 45px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 49px;   
}

.backbutton img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: flaot;   
}

.topcircles {
    position: absolute;
    right: 5px;
    top: 0px;
}

    /* content area */
    .content{
  background:var(--white);
  margin:-28px auto 0;   
  border-radius:12px;
  padding:28px 18px 40px;
  max-width:420px;       
}
   /* card */
    .card{
      background:var(--card-bg);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--card-shadow);
      border:1px solid rgba(0,0,0,0.04);
    }

    .card-top{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:10px;
    }

    .logo{
      width:72px; height:72px;
      display:flex; justify-content:center; align-items:center;
    }

    .logo img{
      max-width:135%;
      max-height:135%;
      object-fit:contain;
    }

    .logo-text{
      margin-left:auto;
      text-align:right;
      color:#777;
      font-size:23px;
      letter-spacing:1px;
      line-height:1.4;
    }

    .divider{
      height:1px;
      background:rgba(0,0,0,0.18);
      margin:14px 0;
    }

    .info{
      font-size:14px;
      line-height:1.7;
      color:#444;
    }

    .info div{
      margin-bottom:6px;
    }

    .barcode{
      margin:22px auto 0;
      width:80%;
      background:#e6e6e6;
      padding:12px;
      text-align:center;
      border-radius:6px;
      font-size:14px;
      color:#333;
    }

  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="bluebg">
    <a href="/backtohome" style="text-decoration: none; color: inherit; outline: none; -webkit-tap-highlight-color: transparent;">
    <div class="backbutton">
        <img src="{{ url_for('static', filename='Assets/images/back-button.png') }}">
        <p style="font-size: 22px; font-family: 'Hind Guntur'; font-weight:600; color:white;"> View<br> Pass</p>
    </div>
    </a>

    <div class="topcircles">
        <img src="{{ url_for('static', filename='Assets/images/Just-circles.png') }}" style="width:150px;">
    </div>

</div>

  <!-- CONTENT -->
  <div class="content">

    <div class="card">

      <div class="card-top">
        <div class="logo">
          <img src="static/Assets/images/rotary-logo.png">
        </div>

        <div class="logo-text">
          <div>CITY</div>
          <div>BUS</div>
          <div>PASS</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="info">
    <div><strong>Total Number Of Tickets:</strong> {{ total_tickets }}</div>
    <div><strong>Pass(es) Holder:</strong> {{ holder_name }}</div>
    <div><strong>Pass Number:</strong> {{ pass_number }}</div>
    <div><strong>Amount Paid:</strong> ₹{{ amount_paid }}</div>
    <div><strong>Issue Date & Time:</strong> {{ issue_datetime }}</div>
</div>
   <div class="barcode">bar code</div>
    </div>
  </div>
  {% if actual_user %}
<div id="pass-data" 
     data-actual-user="true"
     data-holder-name="{{ holder_name }}"
     data-pass-number="{{ pass_number }}"
     data-amount-paid="{{ amount_paid }}"
     data-issue-datetime="{{ issue_datetime }}"
     data-mobile-no="{{ mobile_no }}"
     {% if no_pass %}data-no-pass="true"{% else %}data-no-pass="false"{% endif %}
     style="display: none;">
</div>
{% endif %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const passDataElement = document.getElementById('pass-data');
    if (passDataElement) {
        const passData = {
            actualUser: passDataElement.dataset.actualUser === 'true',
            holderName: passDataElement.dataset.holderName,
            passNumber: passDataElement.dataset.passNumber,
            amountPaid: parseFloat(passDataElement.dataset.amountPaid),
            issueDateTime: passDataElement.dataset.issueDatetime,
            mobileNo: passDataElement.dataset.mobileNo,
            noPass: passDataElement.dataset.noPass === 'true'
        };
        
        console.log('Pass data:', passData);
    }
});
</script>
</body>
</html>
