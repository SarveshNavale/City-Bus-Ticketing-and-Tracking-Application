<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>TC Login - Rotary Bus</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Hind Guntur", sans-serif;
            background: linear-gradient(to bottom, #6C64FF 25%, #ffffff 20%);
            min-height: 100vh;
            color: #636263;
        }

        .main-container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 0 30px 0;
        }

        .tc-header {
            background: transparent;
            color: white;
            padding: 2rem 1.5rem 1.5rem;
            position: relative;
            text-align: center;
        }

        .header-corner-img {
            position: absolute;
            top: 35px;
            right: 0;
            width: 100px;
            height: auto;
        }

        .header-corner-img-2 {
            position: absolute;
            top: 45px;
            left: 20px;
            width: 50px;
            height: auto;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .tc-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(5px);
        }

        .tc-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .tc-header p {
            font-size: 1rem;
            opacity: 0.9;
            max-width: 280px;
            margin: 0 auto;
        }

        .pass-card {
            background: #EEEEEE;
            border-radius: 40px 40px 30px 30px;
            padding: 1.8rem 1.5rem;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
            margin: 0.5rem 1rem 2rem;
            border: none;
        }

        .pass-header {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
        }

        .pass-icon {
            width: 52px;
            height: 52px;
            background: #FFFFFF;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6C64FF;
            font-size: 1.6rem;
            box-shadow: 0px 3px 8px rgba(0,0,0,0.15);
            margin-right: 15px;
        }

        .pass-header h3 {
            font-size: 1.4rem;
            color: #636263;
            margin-bottom: 0.2rem;
        }

        .pass-header p {
            font-size: 0.9rem;
            color: #636263;
            opacity: 0.8;
        }

        .search-container {
            margin-bottom: 0.5rem;
        }

        .search-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #636263;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.8rem;
        }

        .search-label i {
            color: #6C64FF;
            font-size: 1.1rem;
        }

        .input-wrapper {
            background: #FFFFFF;
            border-radius: 50px;
            padding: 0.5rem 1rem;
            box-shadow: 0px 3px 12px rgba(0, 0, 0, 0.15);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            color: #6C64FF;
            font-size: 1.2rem;
            margin-right: 10px;
        }

        #passNumberInput {
            flex: 1;
            height: 48px;
            background: transparent;
            font-size: 15px;
            color: #333;
            border: none;
            font-family: "Hind Guntur", sans-serif;
        }

        #passNumberInput:focus {
            outline: none;
        }

        #passNumberInput::placeholder {
            color: #aaa;
            font-size: 14px;
        }

        #searchBtn {
            width: 100%;
            height: 54px;
            background: #6C64FF;
            border-radius: 50px;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            font-family: "Hind Guntur", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0px 4px 10px rgba(108, 100, 255, 0.3);
            margin: 1.5rem 0 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        #searchBtn:active {
            transform: scale(0.98);
            box-shadow: 0px 2px 5px rgba(108, 100, 255, 0.4);
        }

        #searchBtn i {
            font-size: 1.1rem;
        }

        .pass-info-card {
            background: #FFFFFF;
            border-radius: 40px;
            padding: 1.8rem;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
            margin-top: 1.5rem;
            display: none;
        }

        .pass-info-card.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .verify-badge {
            background: #E8F5E9;
            color: #4CAF50;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .pass-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(99, 98, 99, 0.1);
        }

        .pass-detail-row:last-of-type {
            border-bottom: none;
        }

        .pass-detail-label {
            color: #636263;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .pass-detail-value {
            color: #6C64FF;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: right;
            word-break: break-word;
            max-width: 60%;
        }

        .action-btn {
            width: 100%;
            height: 52px;
            background: #FFFFFF;
            border-radius: 50px;
            border: 2px solid #6C64FF;
            color: #6C64FF;
            font-weight: 600;
            font-size: 1.1rem;
            font-family: "Hind Guntur", sans-serif;
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:active {
            background: #f0f0ff;
        }

        .action-btn i {
            color: #6C64FF;
        }

        .no-result {
            background: #FFFFFF;
            border-radius: 40px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
            margin-top: 1.5rem;
            display: none;
        }

        .no-result.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }

        .no-result i {
            color: #6C64FF;
            opacity: 0.5;
            margin-bottom: 1rem;
        }

        .no-result h4 {
            color: #636263;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .no-result p {
            color: #636263;
            opacity: 0.7;
            font-size: 0.95rem;
        }

        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 380px) {
            .pass-card {
                padding: 1.5rem 1.2rem;
            }
            
            .tc-header h1 {
                font-size: 1.5rem;
            }
            
            .example-pill code {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="tc-header">
            <img src="static/Assets/images/Just-circles.png" class="header-corner-img" alt="">
            <a href="/select" style="text-decoration: none;">
                <img src="static/Assets/images/back-button.png" class="header-corner-img-2" alt="">
            </a>
            <div class="tc-badge">TC LOGIN</div>
            <h1 class="fw-bold">Ticket Checker Portal</h1>
        </div>

        <div class="pass-card">
            <div class="pass-header">
                <div class="pass-icon">
                    <i class="fas fa-search"></i>
                </div>
                <div>
                    <h3>Search Pass</h3>
                    <p>Enter pass number to verify</p>
                </div>
            </div>

            <div class="search-container">
                <div class="search-label">
                    <i class="fas fa-ticket-alt"></i>
                    <span>Enter Pass Number</span>
                </div>

                <div class="input-wrapper">
                    <input type="text" 
                        id="passNumberInput"
                        placeholder="e.g., PS8K2M9">
                </div>

                <button id="searchBtn">
                    <i class="fas fa-check-circle"></i> Verify
                </button>
            </div>

            <div class="pass-info-card" id="passInfoCard">
                <div class="d-flex align-items-center mb-4">
                    <div class="verify-badge">
                        <i class="fas fa-check-circle"></i> VALID PASS
                    </div>
                </div>
                
                <div class="pass-detail-row">
                    <span class="pass-detail-label">Pass Number</span>
                    <span class="pass-detail-value" id="displayPassNumber"></span>
                </div>
                
                <div class="pass-detail-row">
                    <span class="pass-detail-label">Pass Holder</span>
                    <span class="pass-detail-value" id="displayPassHolder"></span>
                </div>
                
                <div class="pass-detail-row">
                    <span class="pass-detail-label">Mobile Number</span>
                    <span class="pass-detail-value" id="displayMobile"></span>
                </div>
                
                <div class="pass-detail-row">
                    <span class="pass-detail-label">Amount Paid</span>
                    <span class="pass-detail-value" id="displayAmount"></span>
                </div>
                
                <div class="pass-detail-row">
                    <span class="pass-detail-label">Issue Date</span>
                    <span class="pass-detail-value" id="displayDate"></span>
                </div>
                
                <div class="pass-detail-row">
                    <span class="pass-detail-label">Issue Time</span>
                    <span class="pass-detail-value" id="displayTime"></span>
                </div>
                
                <button class="action-btn" id="markUsedBtn">
                    <i class="fas fa-check-circle"></i> Mark as Used
                </button>
            </div>

            <div class="no-result" id="noResult">
                <i class="fas fa-exclamation-circle fa-3x"></i>
                <h4>Pass Not Found</h4>
                <p>The pass number you entered does not exist in our system.</p>
            </div>
        </div>
    </div>
    <script>
    function searchPass(passNumber) {
        const input = document.getElementById('passNumberInput');
        if (passNumber) {
            input.value = passNumber;
        }
        
        const searchValue = input.value.trim().toUpperCase();
        const passInfo = document.getElementById('passInfoCard');
        const noResult = document.getElementById('noResult');
        
        const formatRegex = /^PS[A-Z0-9]{5}$/;
        if (!formatRegex.test(searchValue)) {
            alert('Invalid pass number format. Expected: PS followed by 5 characters (e.g., PS8K2M9)');
            return;
        }
        
        const searchBtn = document.getElementById('searchBtn');
        const originalText = searchBtn.innerHTML;
        searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
        searchBtn.disabled = true;
        
        fetch('/verify_pass', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ pass_number: searchValue })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success && data.found) {
                const pass = data.pass;
                
                document.getElementById('displayPassNumber').textContent = pass.pass_number;
                document.getElementById('displayPassHolder').textContent = pass.pass_holder;
                document.getElementById('displayMobile').textContent = pass.mobile_no;
                document.getElementById('displayAmount').textContent = `₹${pass.amount_paid}`;
                document.getElementById('displayDate').textContent = pass.issue_date;
                document.getElementById('displayTime').textContent = pass.issue_time;
                
                passInfo.classList.add('active');
                noResult.classList.remove('active');
            } else {
                passInfo.classList.remove('active');
                noResult.classList.add('active');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Network error. Please try again.');
        })
        .finally(() => {
            searchBtn.innerHTML = originalText;
            searchBtn.disabled = false;
        });
    }

    document.getElementById('searchBtn').addEventListener('click', function() {
        searchPass();
    });

    document.getElementById('passNumberInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            searchPass();
        }
    });

    document.getElementById('markUsedBtn').addEventListener('click', function() {
        const passNumber = document.getElementById('displayPassNumber').textContent;
        alert(`Pass ${passNumber} marked as used successfully!`);
        document.getElementById('passInfoCard').classList.remove('active');
    });
</script>
</body>
</html>
