<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TC Login - Rotary Bus</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Hind Guntur", sans-serif;
            background: linear-gradient(to bottom, #6C64FF 25%, #ffffff 20%);
            min-height: 100vh;
            color: #636263;
        }

        .main-container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 0 30px 0;
        }

        .tc-header {
            background: transparent;
            color: white;
            padding: 2rem 1.5rem 1.5rem;
            position: relative;
            text-align: center;
        }

        .header-corner-img {
            position: absolute;
            top: 35px;
            right: 0;
            width: 100px;
            height: auto;
        }

        .header-corner-img-2 {
            position: absolute;
            top: 45px;
            left: 20px;
            width: 50px;
            height: auto;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .tc-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(5px);
        }

        .tc-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .pass-card {
            background: #EEEEEE;
            border-radius: 40px 40px 30px 30px;
            padding: 1.8rem 1.5rem;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
            margin: 0.5rem 1rem 2rem;
            border: none;
        }

        .pass-header {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
        }

        .pass-icon {
            width: 52px;
            height: 52px;
            background: #FFFFFF;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6C64FF;
            font-size: 1.6rem;
            box-shadow: 0px 3px 8px rgba(0,0,0,0.15);
            margin-right: 15px;
        }

        .pass-header h3 {
            font-size: 1.4rem;
            color: #636263;
            margin-bottom: 0.2rem;
        }

        .pass-header p {
            font-size: 0.9rem;
            color: #636263;
            opacity: 0.8;
        }

        /* Tab Navigation */
        .tab-container {
            display: flex;
            margin-bottom: 20px;
            border-radius: 50px;
            background: #ffffff;
            padding: 5px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px 5px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .tab.active {
            background: #6C64FF;
            color: white;
        }

        .tab i {
            margin-right: 5px;
        }

        /* QR Scanner Styles */
        #qrScanner {
            width: 100%;
            display: none;
        }

        #qrScanner.active {
            display: block;
        }

        .scanner-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 15px;
            aspect-ratio: 1/1;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanner-frame {
            width: 250px;
            height: 250px;
            border: 3px solid #6C64FF;
            border-radius: 20px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        }

        .scanner-line {
            position: absolute;
            width: 220px;
            height: 2px;
            background: #6C64FF;
            animation: scan 2s linear infinite;
            box-shadow: 0 0 10px #6C64FF;
        }

        @keyframes scan {
            0% { transform: translateY(-100px); }
            50% { transform: translateY(100px); }
            100% { transform: translateY(-100px); }
        }

        .scanner-btn {
            width: 100%;
            height: 54px;
            background: #6C64FF;
            border-radius: 50px;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            font-family: "Hind Guntur", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0px 4px 10px rgba(108, 100, 255, 0.3);
            margin: 1rem 0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scanner-btn.stop {
            background: #ff4757;
            box-shadow: 0px 4px 10px rgba(255, 71, 87, 0.3);
        }

        .scanner-btn:active {
            transform: scale(0.98);
        }

        .scanner-btn i {
            font-size: 1.1rem;
        }

        /* Manual Entry Section */
        .search-container {
            display: none;
        }

        .search-container.active {
            display: block;
        }

        .input-wrapper {
            background: #FFFFFF;
            border-radius: 50px;
            padding: 0.5rem 1rem;
            box-shadow: 0px 3px 12px rgba(0, 0, 0, 0.15);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            color: #6C64FF;
            font-size: 1.2rem;
            margin-right: 10px;
        }

        #passNumberInput {
            flex: 1;
            height: 48px;
            background: transparent;
            font-size: 16px;
            color: #333;
            border: none;
            font-family: "Hind Guntur", sans-serif;
        }

        #passNumberInput:focus {
            outline: none;
        }

        #searchBtn {
            width: 100%;
            height: 54px;
            background: #6C64FF;
            border-radius: 50px;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            font-family: "Hind Guntur", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0px 4px 10px rgba(108, 100, 255, 0.3);
            margin: 1rem 0;
            cursor: pointer;
            transition: all 0.2s;
        }

        #searchBtn:active {
            transform: scale(0.98);
        }

        /* Pass Info Card */
        .pass-info-card {
            background: #FFFFFF;
            border-radius: 40px;
            padding: 1.8rem;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
            margin-top: 1.5rem;
            display: none;
        }

        .pass-info-card.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .verify-badge {
            background: #E8F5E9;
            color: #4CAF50;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .pass-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(99, 98, 99, 0.1);
        }

        .pass-detail-row:last-of-type {
            border-bottom: none;
        }

        .pass-detail-label {
            color: #636263;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .pass-detail-value {
            color: #6C64FF;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: right;
            word-break: break-word;
            max-width: 60%;
        }

        .action-btn {
            width: 100%;
            height: 52px;
            background: #FFFFFF;
            border-radius: 50px;
            border: 2px solid #6C64FF;
            color: #6C64FF;
            font-weight: 600;
            font-size: 1.1rem;
            font-family: "Hind Guntur", sans-serif;
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:active {
            background: #f0f0ff;
        }

        .no-result {
            background: #FFFFFF;
            border-radius: 40px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
            margin-top: 1.5rem;
            display: none;
        }

        .no-result.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }

        .camera-permission-msg {
            text-align: center;
            padding: 30px 20px;
            color: #666;
        }

        .camera-permission-msg i {
            font-size: 48px;
            color: #6C64FF;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="tc-header">
            <img src="{{ url_for('static', filename='Assets/images/Just-circles.png') }}" class="header-corner-img" alt="">
            <a href="/select" style="text-decoration: none;">
                <img src="{{ url_for('static', filename='Assets/images/back-button.png') }}" class="header-corner-img-2" alt="">
            </a>
            <div class="tc-badge">TC LOGIN</div>
            <h1 class="fw-bold">Ticket Checker Portal</h1>
        </div>

        <div class="pass-card">
            <div class="pass-header">
                <div class="pass-icon">
                    <i class="fas fa-ticket-alt"></i>
                </div>
                <div>
                    <h3>Verify Pass</h3>
                    <p>Scan QR or enter pass number</p>
                </div>
            </div>
            <div class="tab-container">
                <div class="tab active" id="scanTab" onclick="switchMode('scan')">
                    <i class="fas fa-qrcode"></i> Scan QR
                </div>
                <div class="tab" id="manualTab" onclick="switchMode('manual')">
                    <i class="fas fa-keyboard"></i> Manual
                </div>
            </div>
            <div id="qrScanner" class="active">
                <div class="scanner-container" id="scannerContainer">
                    <video id="video" playsinline></video>
                    <div class="scanner-overlay">
                        <div class="scanner-frame"></div>
                        <div class="scanner-line"></div>
                    </div>
                </div>
                
                <div id="cameraPermissionMsg" class="camera-permission-msg" style="display: none;">
                </div>

                <button class="scanner-btn" id="startScannerBtn">
                    <i class="fas fa-camera"></i> Start Camera
                </button>
                <button class="scanner-btn stop" id="stopScannerBtn" style="display: none;">
                    <i class="fas fa-stop"></i> Stop Camera
                </button>
                
                <p style="text-align: center; color: #888; font-size: 14px; margin-top: 10px;">
                    <i class="fas fa-info-circle"></i> Center the QR code in the frame
                </p>
            </div>
            <div class="search-container" id="manualEntry">
                <div class="input-wrapper">
                    <i class="fas fa-hashtag"></i>
                    <input type="text" 
                        id="passNumberInput"
                        placeholder="Enter pass number (e.g., PS8K2M9)"
                        autocomplete="off">
                </div>

                <button id="searchBtn">
                    <i class="fas fa-check-circle"></i> Verify Pass
                </button>
            </div>
            <div class="pass-info-card" id="passInfoCard">
                <div class="verify-badge">
                    <i class="fas fa-check-circle"></i> VALID PASS
                </div>
                
                <div class="pass-detail-row">
                    <span class="pass-detail-label">Pass Number</span>
                    <span class="pass-detail-value" id="displayPassNumber"></span>
                </div>
                
                <div class="pass-detail-row">
                    <span class="pass-detail-label">Pass Holder</span>
                    <span class="pass-detail-value" id="displayPassHolder"></span>
                </div>
                
                <div class="pass-detail-row">
                    <span class="pass-detail-label">Mobile Number</span>
                    <span class="pass-detail-value" id="displayMobile"></span>
                </div>
                
                <div class="pass-detail-row">
                    <span class="pass-detail-label">Amount Paid</span>
                    <span class="pass-detail-value" id="displayAmount"></span>
                </div>
                
                <div class="pass-detail-row">
                    <span class="pass-detail-label">Issue Date</span>
                    <span class="pass-detail-value" id="displayDate"></span>
                </div>
                
                <div class="pass-detail-row">
                    <span class="pass-detail-label">Issue Time</span>
                    <span class="pass-detail-value" id="displayTime"></span>
                </div>
                
                <button class="action-btn" id="markUsedBtn">
                    <i class="fas fa-check-circle"></i> Mark as Used
                </button>
            </div>

            <div class="no-result" id="noResult">
                <i class="fas fa-exclamation-circle fa-3x"></i>
                <h4>Pass Not Found</h4>
                <p>The pass number you entered does not exist in our system.</p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <script>
    let scanning = false;
    let videoStream = null;
    let scanInterval = null;
    const video = document.getElementById('video');
    const scannerContainer = document.getElementById('scannerContainer');
    const cameraPermissionMsg = document.getElementById('cameraPermissionMsg');
    const startBtn = document.getElementById('startScannerBtn');
    const stopBtn = document.getElementById('stopScannerBtn');

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const isHTTPS = window.location.protocol === 'https:';
    
    console.log('Connection info:', {
        hostname: window.location.hostname,
        protocol: window.location.protocol,
        isLocalhost: isLocalhost,
        isHTTPS: isHTTPS
    });

    function isCameraSupported() {
        return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    }

    function updateCameraSupportMessage() {
        const cameraMsg = document.getElementById('cameraPermissionMsg');
        
        if (!isCameraSupported()) {
            let message = '';
            if (!isHTTPS && !isLocalhost) {
                message = `
                    <i class="fas fa-lock"></i>
                    <h4>HTTPS Required</h4>
                    <p>Camera access requires HTTPS when accessing from network IP.<br>
                    Please use:<br>
                    • <strong>http://localhost:5000</strong> (for testing)<br>
                    • Or access via HTTPS</p>
                `;
            } else {
                message = `
                    <i class="fas fa-camera"></i>
                    <h4>Camera Not Supported</h4>
                    <p>Your browser doesn't support camera access.<br>
                    Please use the manual entry option.</p>
                `;
            }
            cameraMsg.innerHTML = message;
            cameraMsg.style.display = 'block';
            startBtn.style.display = 'none';
            return false;
        }
        return true;
    }

    function switchMode(mode) {
        const scanTab = document.getElementById('scanTab');
        const manualTab = document.getElementById('manualTab');
        const qrScanner = document.getElementById('qrScanner');
        const manualEntry = document.getElementById('manualEntry');

        if (mode === 'scan') {
            scanTab.classList.add('active');
            manualTab.classList.remove('active');
            qrScanner.classList.add('active');
            manualEntry.classList.remove('active');
            
            if (!isCameraSupported()) {
                updateCameraSupportMessage();
            }
        } else {
            manualTab.classList.add('active');
            scanTab.classList.remove('active');
            qrScanner.classList.remove('active');
            manualEntry.classList.add('active');
            stopScanner();
        }
    }

    async function startScanner() {
        try {
            document.getElementById('passInfoCard').classList.remove('active');
            document.getElementById('noResult').classList.remove('active');
            
            if (!isCameraSupported()) {
                updateCameraSupportMessage();
                return;
            }
            
            cameraPermissionMsg.style.display = 'none';
            
            const constraints = {
                video: {
                    facingMode: 'environment', 
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            console.log('Requesting camera access...');
            
            videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            
            console.log('Camera access granted');
            
            video.srcObject = videoStream;
            
            await new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play()
                        .then(resolve)
                        .catch(e => console.error('Error playing video:', e));
                };
            });

            scanning = true;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';
            
            scanFrame();
            
        } catch (err) {
            console.error('Camera error:', err);
            
            let errorMessage = '';
            if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                errorMessage = `
                    <i class="fas fa-ban"></i>
                    <h4>Camera Access Denied</h4>
                    <p>Please allow camera access in your browser settings.<br>
                    On mobile: Look for camera permissions in site settings.</p>
                `;
            } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                errorMessage = `
                    <i class="fas fa-video-slash"></i>
                    <h4>No Camera Found</h4>
                    <p>No camera detected on this device.<br>
                    Please use the manual entry option.</p>
                `;
            } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                errorMessage = `
                    <i class="fas fa-exclamation-triangle"></i>
                    <h4>Camera in Use</h4>
                    <p>Camera is being used by another application.<br>
                    Close other apps and try again.</p>
                `;
            } else if (err.name === 'OverconstrainedError') {
                errorMessage = `
                    <i class="fas fa-exclamation-circle"></i>
                    <h4>Camera Not Compatible</h4>
                    <p>Your camera doesn't support required settings.<br>
                    Please use the manual entry option.</p>
                `;
            } else {
                errorMessage = `
                    <i class="fas fa-question-circle"></i>
                    <h4>Camera Error</h4>
                    <p>Could not access camera: ${err.message}<br>
                    Please use the manual entry option.</p>
                `;
            }
            
            cameraPermissionMsg.innerHTML = errorMessage;
            cameraPermissionMsg.style.display = 'block';
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
        }
    }

    function stopScanner() {
        scanning = false;
        
        if (scanInterval) {
            cancelAnimationFrame(scanInterval);
            scanInterval = null;
        }
        
        if (videoStream) {
            videoStream.getTracks().forEach(track => {
                track.stop();
                console.log('Camera track stopped');
            });
            videoStream = null;
        }
        
        if (video.srcObject) {
            video.srcObject = null;
        }
        
        startBtn.style.display = 'block';
        stopBtn.style.display = 'none';
    }

    function scanFrame() {
        if (!scanning) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            if (canvas.width > 0 && canvas.height > 0) {
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                
                try {
                    const code = jsQR(imageData.data, canvas.width, canvas.height, {
                        inversionAttempts: 'dontInvert'
                    });

                    if (code) {
                        console.log('QR Code found:', code.data);
                        
                        if (navigator.vibrate) navigator.vibrate(200);
                        
                        stopScanner();
                        
                        verifyPassFromQR(code.data);
                        return;
                    }
                } catch (qrError) {
                    console.error('QR scanning error:', qrError);
                }
            }
        }
        
        scanInterval = requestAnimationFrame(scanFrame);
    }
    async function verifyPassFromQR(qrData) {
        try {
            const response = await fetch('/verify_pass_qr', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ qr_data: qrData })
            });

            const data = await response.json();

            if (data.success && data.found) {
                const pass = data.pass;
                
                document.getElementById('displayPassNumber').textContent = pass.pass_number;
                document.getElementById('displayPassHolder').textContent = pass.pass_holder;
                document.getElementById('displayMobile').textContent = pass.mobile_no;
                document.getElementById('displayAmount').textContent = `₹${pass.amount_paid}`;
                document.getElementById('displayDate').textContent = pass.issue_date;
                document.getElementById('displayTime').textContent = pass.issue_time;
                
                document.getElementById('passInfoCard').classList.add('active');
                document.getElementById('noResult').classList.remove('active');
            } else {
                document.getElementById('passInfoCard').classList.remove('active');
                document.getElementById('noResult').classList.add('active');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Network error. Please try again.');
        }
    }
    async function searchPass() {
        const input = document.getElementById('passNumberInput');
        const passNumber = input.value.trim().toUpperCase();
        
        if (!passNumber) {
            alert('Please enter a pass number');
            return;
        }
        
        const searchBtn = document.getElementById('searchBtn');
        const originalText = searchBtn.innerHTML;
        searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
        searchBtn.disabled = true;
        
        try {
            const response = await fetch('/verify_pass', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ pass_number: passNumber })
            });

            const data = await response.json();

            if (data.success && data.found) {
                const pass = data.pass;
                
                document.getElementById('displayPassNumber').textContent = pass.pass_number;
                document.getElementById('displayPassHolder').textContent = pass.pass_holder;
                document.getElementById('displayMobile').textContent = pass.mobile_no;
                document.getElementById('displayAmount').textContent = `₹${pass.amount_paid}`;
                document.getElementById('displayDate').textContent = pass.issue_date;
                document.getElementById('displayTime').textContent = pass.issue_time;
                
                document.getElementById('passInfoCard').classList.add('active');
                document.getElementById('noResult').classList.remove('active');
            } else {
                document.getElementById('passInfoCard').classList.remove('active');
                document.getElementById('noResult').classList.add('active');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Network error. Please try again.');
        } finally {
            searchBtn.innerHTML = originalText;
            searchBtn.disabled = false;
        }
    }
    document.getElementById('markUsedBtn').addEventListener('click', function() {
        const passNumber = document.getElementById('displayPassNumber').textContent;
        alert(`Pass ${passNumber} marked as used successfully!`);
        document.getElementById('passInfoCard').classList.remove('active');
    });

    startBtn.addEventListener('click', startScanner);
    stopBtn.addEventListener('click', stopScanner);
    document.getElementById('searchBtn').addEventListener('click', searchPass);
    
    document.getElementById('passNumberInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            searchPass();
        }
    });

    window.addEventListener('beforeunload', function() {
        stopScanner();
    });
    document.addEventListener('DOMContentLoaded', function() {
        if (!isCameraSupported()) {
            updateCameraSupportMessage();
        }
        
        if (isMobile && document.getElementById('scanTab').classList.contains('active') && isCameraSupported()) {
            setTimeout(startScanner, 1000);
        }
    });
</script>
</body>
</html>
