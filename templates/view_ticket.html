<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Tickets</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>


body{
  margin:0;
  font-family:"Nunito", sans-serif;
  background:#ffffff;
  color:#333;
}

.bluebg{
  background:linear-gradient(135deg,#6C64FF 0%,#8B84FF 100%);
  height:180px;
  width:100%;
  position:relative;
  overflow:hidden;
}

.circle1{
  position:absolute;
  width:190px;
  height:190px;
  border-radius:50%;
  background:rgba(255,255,255,0.10);
  top:-55px;
  right:-45px;
}

.circle2{
  position:absolute;
  width:115px;
  height:115px;
  border-radius:50%;
  background:rgba(255,255,255,0.07);
  top:45px;
  right:25px;
}

.backbutton{
  position:absolute;
  top:45px;
  left:20px;
  display:flex;
  align-items:center;
  gap:49px;
}

.backbutton img{
  width:72px;
  height:72px;
  object-fit:contain;
  display:block;
}


.content{
  padding:30px 18px 40px;
  max-width:420px;
  margin:auto;
}


.refresh-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.section-label{
  font-size:18px;
  color:#636363;
  font-weight:600;
}

.refresh-btn{
  border:none;
  background:#f0f0ff;
  color:#6C64FF;
  padding:6px 14px;
  border-radius:20px;
  cursor:pointer;
  font-family:"Nunito";
}



.ticket-card{
  background:#ffffff;
  border-radius:18px;
  border:1px solid #e8e8f0;
  margin-bottom:16px;
  overflow:hidden;
  box-shadow:0 2px 12px rgba(108,100,255,0.06);
  animation:slideUp .35s ease both;
}

@keyframes slideUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}


.route-strip{
  background:linear-gradient(135deg,#6C64FF,#8f89ff);
  padding:16px 18px;
  display:flex;
  align-items:center;
  gap:10px;
}

.stop-pill{
  flex:1;
  text-align:center;
}

.stop-pill .label{
  font-size:10px;
  color:rgba(255,255,255,.7);
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:600;
}

.stop-pill .name{
  font-size:13px;
  font-weight:700;
  color:white;
  margin-top:2px;
  word-break:break-word;
}

.route-arrow svg{
  width:20px;
  height:20px;
  stroke:white;
  fill:none;
}


.ticket-details{
  padding:14px 18px;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.detail-item .d-label{
  font-size:10px;
  text-transform:uppercase;
  color:#888;
  font-weight:600;
}

.detail-item .d-value{
  font-size:13px;
  font-weight:600;
  margin-top:2px;
}

.detail-item.full{
  grid-column:1 / -1;
}


.proximity-banner{
  display:none;
  background:#fff3cd;
  border-top:1px solid #fde68a;
  padding:12px 18px;
  font-size:13px;
}

.proximity-banner.show{
  display:flex;
  justify-content:space-between;
}

.countdown{
  font-weight:bold;
  color:#d90429;
}


.ticket-card.deleted{
  opacity:.4;
  transform:scale(.97);
}

.ticket-card.completed .route-strip{
  background:linear-gradient(135deg,#22c55e,#16a34a);
}


.spinner{
  width:24px;
  height:24px;
  border:3px solid #ddd;
  border-top-color:#6C64FF;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:40px auto;
}

@keyframes spin{to{transform:rotate(360deg)}}

.state-msg{
  text-align:center;
  padding:60px 20px;
  color:#777;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="bluebg">

<div class="circle1"></div>
<div class="circle2"></div>

<a href="/backtohome" style="text-decoration:none;color:inherit;">
<div class="backbutton">
<img src="{{ url_for('static', filename='Assets/images/back-button.png') }}">
<p style="font-size:22px;font-weight:600;color:white;">
My<br>Tickets
</p>
</div>
</a>




<div class="topcircles">

</div>
</div>

<!-- CONTENT -->
<div class="content">

<div class="refresh-row">
<span class="section-label">Active Tickets</span>
<button class="refresh-btn" onclick="init()">Refresh</button>
</div>

<div id="tickets-container">
<div class="spinner"></div>
</div>

</div>

<script>



const PROXIMITY_METRES = 100;
const DELETE_DELAY_MS  = 60000;

const ticketTimers = {};

function haversineMetres(lat1, lon1, lat2, lon2){
 const R=6371000;
 const toRad=d=>d*Math.PI/180;
 const dLat=toRad(lat2-lat1);
 const dLon=toRad(lon2-lon1);
 const a=Math.sin(dLat/2)**2+
 Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}


function renderTickets(tickets){

 const container=document.getElementById('tickets-container');

 if(tickets.length===0){
 container.innerHTML=`
 <div class="state-msg">
 <h3>No tickets yet</h3>
 <p>Buy a ticket first.</p>
 </div>`;
 return;
 }

 container.innerHTML=tickets.map(t=>`

 <div class="ticket-card" id="card-${t.id}">

   <div class="route-strip">

     <div class="stop-pill">
       <div class="label">From</div>
       <div class="name">${t.start_dest}</div>
     </div>

     <div class="route-arrow">
       <svg viewBox="0 0 24 24" stroke-width="2">
       <path d="M5 12h14M12 5l7 7-7 7"/>
       </svg>
     </div>

     <div class="stop-pill">
       <div class="label">To</div>
       <div class="name">${t.final_dest}</div>
     </div>

   </div>

   <div class="ticket-details">
     <div class="detail-grid">

       <div class="detail-item">
         <div class="d-label">Tickets</div>
         <div class="d-value">${t.no_of_tickets}</div>
       </div>

       <div class="detail-item">
         <div class="d-label">Amount</div>
         <div class="d-value">₹${parseFloat(t.amount_paid).toFixed(2)}</div>
       </div>

       <div class="detail-item full">
         <div class="d-label">Ticket Number</div>
         <div class="d-value">${t.ticket_number}</div>
       </div>

       <div class="detail-item">
         <div class="d-label">Holder</div>
         <div class="d-value">${t.ticket_holder}</div>
       </div>

       <div class="detail-item">
         <div class="d-label">Issued</div>
         <div class="d-value">${t.issue_date}</div>
       </div>

     </div>
   </div>

   <div class="proximity-banner" id="banner-${t.id}">
     📍 Near <b>${t.final_dest}</b>
     <span class="countdown" id="countdown-${t.id}">1:00</span>
   </div>

 </div>

 `).join('');
}

/* ───────── REMAINING LOGIC SAME ───────── */

async function getUserLocationFromDB(){
 try{
  const res=await fetch('/get_user_location');
  const data=await res.json();
  if(!data.success)return null;
  return{lat:data.latitude,lon:data.longitude};
 }catch(e){return null;}
}

async function checkAllProximities(tickets){

 const userLoc=await getUserLocationFromDB();
 if(!userLoc)return;

 for(const ticket of tickets){

  const card=document.getElementById(`card-${ticket.id}`);
  if(!card||card.classList.contains('completed'))continue;

  const res=await fetch(`/get_stop_coords?stop_name=${encodeURIComponent(ticket.final_dest)}`);
  const data=await res.json();
  if(!data.success)continue;

  const dist=haversineMetres(userLoc.lat,userLoc.lon,data.latitude,data.longitude);

  if(dist<=PROXIMITY_METRES){
   if(!ticketTimers[ticket.id])
    startArrivalSequence(ticket.id);
  }
 }
}

function startArrivalSequence(id){

 const banner=document.getElementById(`banner-${id}`);
 const countdown=document.getElementById(`countdown-${id}`);
 banner.classList.add('show');

 let remaining=DELETE_DELAY_MS/1000;

 const interval=setInterval(()=>{
  remaining--;
  const m=Math.floor(remaining/60);
  const s=remaining%60;
  countdown.textContent=`${m}:${String(s).padStart(2,'0')}`;
 },1000);

 const timeout=setTimeout(()=>deleteTicket(id),DELETE_DELAY_MS);

 ticketTimers[id]={interval,timeout};
}

async function deleteTicket(id){

 await fetch(`/delete_ticket/${id}`,{method:'POST'});

 const card=document.getElementById(`card-${id}`);
 if(card){
  card.classList.add('completed');
  setTimeout(()=>card.classList.add('deleted'),2000);
 }
}

let proximityInterval=null;
let loadedTickets=[];

async function init(){

 if(proximityInterval)clearInterval(proximityInterval);

 document.getElementById('tickets-container').innerHTML='<div class="spinner"></div>';

 const res=await fetch('/get_all_tickets');
 const data=await res.json();

 loadedTickets=data.tickets||[];
 renderTickets(loadedTickets);

 if(loadedTickets.length){
  proximityInterval=setInterval(()=>checkAllProximities(loadedTickets),15000);
  checkAllProximities(loadedTickets);
 }
}

init();

</script>

</body>
</html>
