<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: "Hind Guntur", sans-serif;
    
    background: linear-gradient(to bottom, #6C64FF 37%, #ffffff 20%);
    min-height: 100vh; 
}

.top-area {
    height: 220px;
    width: 100%;
    position: relative;
}

.top-content {
    padding: 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.profile-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 24px;
}

.profile-row img {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    
}

.bell {
   
    position: absolute;
    right: 0px;
    top: 5px;
}

.white-card {
    width: 88%;
    background: #EEEEEE;
    border-radius: 44px;
    height: 650px;
    margin: -55px auto 140px auto;
    padding: 20px 15px 120px 15px;
    box-shadow: 0px 4px 13px rgba(0,0,0,0.25);
}

.text {
    font-size: 3px;
    font-family: 'Hind Guntur', sans-serif;
    font-weight: 600;
    color: #636263; 
    margin: 0;
}

.search-container {
    position: relative;
    width: 320px;
}

.search-box {
    width: 100%;
    height: 80px;
    background: #F4F4F4;
    padding: 0 13px 0 45px; 
    border-radius: 84px;
    font-size: 21px;
    color: #636363;
    border: 0;
    box-shadow: 0px 3px 16.2px rgba(0, 0, 0, 0.25); 
    margin-bottom: 18px;
}

.search-icon {
    position: absolute;
    left: 15px; 
    top: 50%;
    transform: translateY(-50%);
    height: 34px; 
    width: auto;
    pointer-events: none; 
}

.btn-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    margin: 10px;
}

.card-btn {
    width: 46%;
    height: 195px; 
    background: #FFFFFF;
    border-radius: 44px;
    box-shadow: 0px 4px 8.3px rgba(0,0,0,0.25);
    text-align: center;
    padding-top: 10px;
    margin-bottom: 15px;
    color: #636263;
    font-size: 1px;
    font-weight: 600;
}

.card-btn span {
    display: block;
    font-size: 25px;
    margin-bottom: 8px;
    margin-left: 12px;
    text-align: left;
}

.full-btn {
    width: 100%;
}

.navwrap {
    width: 92%;
    height: 80px;
    background: #6C64FF;
    position: fixed;
    bottom: 15px;
    left: 4%;
    border-radius: 33px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0px -2px 12px rgba(0,0,0,0.25);
}

.navitem {
    text-align: center;
    font-size: 13px;
    color: #ffffff;
    font-weight: 600;
}

.navitem img {
    width: 28px;
    height: 28px;
    margin-bottom: 4px;
    margin-top: 5px;
}

/* ONLY FIX – Buy Pass half width, Chat with Tiko stays full */
.card-btn.full-btn[onclick*="handleBuyPassClick"] {
    width: 46%;
}
</style>
</head>

<body>

<div class="top-area">
    <div class="top-content">

            <a href="/profile" style="text-decoration: none; color: inherit; outline: none; -webkit-tap-highlight-color: transparent;">
                <div class="profile-row">
                    <img src="static/Assets/images/homepfp.png">
                    <span id="currentUserName" style="font-size: 18px; font-family: 'poppins', sans-serif; color: rgba(255,255,255,0.9);">
                        Loading...
                    </span>
                </div>
            </a>

        <div class="bell" style="position: relative; cursor: pointer;" onclick="window.location.href='/notifications'">
            <img src="static/Assets/images/Bell-icon.png">
            <span id="notificationCount" style="display: none; position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold;">0</span>
        </div>

    </div>
</div>

<div class="white-card">
<form style="position: relative; width: 375px;">
    <img src="static/Assets/images/search.png" alt="search logo" class="search-icon">
    <input class="search-box"
           type="search"
           id="destinationInput"
           placeholder="  Choose your destination"
           list="stopsList"
           autocomplete="off">
    <datalist id="stopsList"></datalist>
</form>

<div class="btn-grid">

    <div class="card-btn " onclick="window.location.href='/view_pass'" style="cursor: pointer;">
        <img src="static/Assets/images/view-ticket.png" style="margin-bottom: 1px;">
        <p style="font-size:20px; margin-top: 0px;">View Ticket</p>
    </div>

    <div class="card-btn " onclick="window.location.href='/view_pass'" style="cursor: pointer;">
        <img src="static/Assets/images/view-pass.png" style="margin-bottom: 1px;">
        <p style="font-size:20px; margin-top: 5px;">View Pass</p>
    </div>

    <div class="card-btn " onclick="window.location.href='/routestime'" style="cursor: pointer;">
        <img src="static/Assets/images/route-timetable.png" style="margin-bottom: 1px;">
        <p style="font-size:20px; margin-top: 4px;">Route<br>Timetables</p>
    </div>

    <div class="card-btn full-btn" onclick="handleBuyPassClick()">
        <img src="static/Assets/images/view-pass.png" style="margin-bottom: 1px;">
        <p style="font-size:20px; margin-top: 5px;">Buy Pass</p>
    </div>

    <div class="card-btn full-btn" onclick="window.location.href='/robo'" style="cursor: pointer;">
        <span style="color: rgb(247, 149, 149); font-size: 20px;">NEW!</span>
        <img src="static/Assets/images/robo.png" style="margin-bottom: 1px; margin-top: 0px;">
        <p class="text" style="font-size:22px;">Chat With Tiko</p>
    </div>

</div>
</div>

<div class="navwrap">

    <div class="navitem">
        <img src="static/Assets/images/home-logo.png" alt="home">
        <div>Home</div>
    </div>

    <a href="/map" style="text-decoration: none; color: inherit;">
    <div class="navitem">
        <img src="static/Assets/images/loc-logo.png" alt="loc">
        <div>Map</div>
    </div>
    </a>

    <a href="/play" style="text-decoration: none; color: inherit; outline: none; -webkit-tap-highlight-color: transparent;">
        <div class="navitem">
            <img src="static/Assets/images/games-logo.png" alt="play">
            <div>Play</div>
        </div>
    </a>

    <div class="navitem" onclick="window.location.href='/faqs'">
        <img src="static/Assets/images/FAQs-logo.png" alt="faqs">
        <div>FAQs</div>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('Homepage loaded, fetching user...');
    
    fetch('/get_current_user')
        .then(response => response.json())
        .then(result => {
            console.log('User data:', result);
            
            if (result.success && result.logged_in && result.user) {
                const userNameElement = document.getElementById('currentUserName');
                if (userNameElement) {
                    userNameElement.textContent = result.user.name;
                    console.log('Homepage updated:', result.user.name);
                } else {
                    console.error('currentUserName element not found');
                }
            } else {
                console.log('No user logged in');
            }
        })
        .catch(error => {
            console.error('Error loading user:', error);
        });
});

let isNavigating = false;

document.addEventListener('click', function(e) {
    if (e.target.tagName === 'A' || e.target.closest('a')) {
        const link = e.target.closest('a');
        if (link.href && !link.target) { 
            isNavigating = true;
            console.log('Internal navigation detected, will not clear login');
        }
    }
});

window.addEventListener('submit', function() {
    isNavigating = true;
    console.log('Form submission, will not clear login');
});

window.addEventListener('pageshow', function() {
    isNavigating = false;
    console.log('Page shown, reset navigation flag');
});

async function handleBuyPassClick() {
    console.log('Buy Pass button clicked');
    
    try {
        const response = await fetch('/get_current_user');
        const result = await response.json();
        console.log('Pre-navigation login check:', result);
        
        if (result.success && result.logged_in) {
            console.log('Navigating to buy_pass page...');
            window.location.href = '/buy_pass';
        } else {
            alert('Please login first.');
            window.location.href = '/';
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
    }
}

async function debugLoginFlow() {
    console.log('=== DEBUG LOGIN FLOW ===');
    
    try {
        const userResponse = await fetch('/get_current_user');
        const userResult = await userResponse.json();
        console.log('1. Current user:', userResult);
    } catch (error) {
        console.error('User check error:', error);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    console.log('Homepage loaded');
    debugLoginFlow();
});

function checkNotificationStatus() {
    fetch('/check_new_notifications')
        .then(response => response.json())
        .then(data => {
            const dot = document.getElementById('notificationDot');
            if (dot) {
                if (data.success && data.new_notifications) {
                    dot.style.display = 'block';
                    console.log('🔔 New notifications available!');
                } else {
                    dot.style.display = 'none';
                }
            }
        })
        .catch(error => console.error('Error checking notifications:', error));
}

setInterval(checkNotificationStatus, 15000);
checkNotificationStatus();

function updateNotificationCount() {
    fetch('/check_new_notifications')
        .then(response => response.json())
        .then(data => {
            const counter = document.getElementById('notificationCount');
            if (data.success && data.count > 0) {
                counter.textContent = data.count;
                counter.style.display = 'flex';
            } else {
                counter.style.display = 'none';
            }
        })
        .catch(err => console.error(err));
}

setInterval(updateNotificationCount, 5000);
updateNotificationCount();

// Search stops autocomplete
const searchInput = document.getElementById('destinationInput');
const dataList = document.getElementById('stopsList');

searchInput.addEventListener('input', function() {
    const query = this.value.trim();

    if (query.length === 0) {
        dataList.innerHTML = "";
        return;
    }

    fetch(`/search_stops?q=${query}`)
        .then(response => response.json())
        .then(data => {
            dataList.innerHTML = "";

            if (data.success) {
                data.stops.forEach(stop => {
                    const option = document.createElement("option");
                    option.value = stop;
                    dataList.appendChild(option);
                });
            }
        })
        .catch(error => console.error(error));
});

// When user selects a stop, just navigate to choose_destination — no DB save here
searchInput.addEventListener('change', function() {
    const selected = this.value.trim();
    if (selected) {
        const options = Array.from(dataList.options).map(o => o.value);
        if (options.includes(selected)) {
            window.location.href = `/choose_destination?destination=${encodeURIComponent(selected)}`;
        }
    }
});
</script>

</body>
</html>
