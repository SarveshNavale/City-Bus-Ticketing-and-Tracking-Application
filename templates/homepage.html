<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    @keyframes shinePass {
    0%   { left: -100%; }
    50%  { left: 150%; }
    100% { left: 150%; }
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 0;
    font-family: "Nunito", sans-serif;
    background: #F0F2FF;
    min-height: 100vh;
}

/* ── TOP HEADER ── */
.top-area {
    background: linear-gradient(135deg, #6C64FF 0%, #8B84FF 100%);
    padding: 28px 24px 70px 24px;
    border-radius: 0 0 36px 36px;
}

.top-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.profile-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.profile-row img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.6);
    object-fit: cover;
}

.greeting-text {
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    font-weight: 600;
    display: block;
}

#currentUserName {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    display: block;
}

/* Bell */
.bell-container {
    position: relative;
    width: 44px;
    height: 44px;
    background: rgba(255,255,255,0.18);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.bell-container i {
    font-size: 20px;
    color: #fff;
}

.notification-dot {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 10px;
    height: 10px;
    background: #FF4444;
    border-radius: 50%;
    border: 2px solid white;
    display: none;
    z-index: 10;
}

/* ── LANGUAGE TOGGLE ── */
.lang-toggle {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.18);
    border-radius: 14px;
    overflow: hidden;
    height: 44px;
    cursor: pointer;
}

.lang-btn {
    padding: 0 13px;
    height: 100%;
    font-size: 12px;
    font-weight: 800;
    color: rgba(255,255,255,0.65);
    background: transparent;
    border: none;
    font-family: "Nunito", sans-serif;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    letter-spacing: 0.3px;
}

.lang-btn.active {
    background: rgba(255,255,255,0.30);
    color: #fff;
}

/* ── TOP-RIGHT CONTROLS ── */
.top-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* ── SLIDE UP ANIMATION ── */
@keyframes slideUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
}

.search-wrapper {
    animation: slideUp 0.4s ease 0.05s both;
}

.section-label {
    animation: slideUp 0.4s ease 0.10s both;
}

.card-btn:nth-child(1) { animation: slideUp 0.4s ease 0.12s both; }
.card-btn:nth-child(2) { animation: slideUp 0.4s ease 0.18s both; }
.card-btn:nth-child(3) { animation: slideUp 0.4s ease 0.24s both; }
.card-btn:nth-child(4) { animation: slideUp 0.4s ease 0.30s both; }
.card-btn:nth-child(5) { animation: slideUp 0.4s ease 0.36s both; }

/* ── SEARCH ── */
.search-wrapper {
    margin: -28px 20px 0 20px;
    position: relative;
    z-index: 10;
}

.search-container { position: relative; }

.search-box {
    width: 100%;
    height: 56px;
    background: #fff;
    padding: 0 20px 0 48px;
    border-radius: 18px;
    font-size: 15px;
    color: #444;
    font-family: "Nunito", sans-serif;
    font-weight: 600;
    border: none;
    box-shadow: 0 8px 30px rgba(108,100,255,0.18);
    outline: none;
}

.search-box::placeholder { color: #BBBBBB; font-weight: 600; }

.search-icon-fa {
    position: absolute;
    left: 17px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 17px;
    color: #BBBBBB;
    pointer-events: none;
}

/* ── MAIN CARD AREA ── */
.white-card {
    margin: 22px 16px 100px 16px;
}

.section-label {
    font-size: 12px;
    font-weight: 800;
    color: #AAAACC;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 4px 14px 4px;
}

/* ── BUTTON GRID ── */
.btn-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
}

.card-btn {
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 4px 18px rgba(108,100,255,0.10);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 18px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    text-decoration: none;
}

.card-btn:active {
    transform: scale(0.97);
    box-shadow: 0 2px 8px rgba(108,100,255,0.13);
}

.card-icon-wrap {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: #F0F2FF;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    font-size: 20px;
    color: #6C64FF;
}

.card-label {
    font-size: 15px;
    font-weight: 800;
    color: #333;
    line-height: 1.3;
    margin: 0;
}

.half {
    width: calc(50% - 7px);
    height: 148px;
}

.full-btn {
    width: 100%;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
    padding: 18px 22px;
    height: auto;
}

.full-btn .card-icon-wrap { margin-bottom: 0; flex-shrink: 0; }
.full-btn .card-label { font-size: 16px; }

/* Tiko card */
.tiko-card {
    background: linear-gradient(135deg, #6C64FF 0%, #9B95FF 100%);
}
.tiko-card .card-icon-wrap {
    background: rgba(255,255,255,0.2);
    color: #fff;
}
.tiko-card .card-label { color: #fff; }

.tiko-badge {
    background: #FF5C5C;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    margin-left: auto;
}

/* ── NAV BAR ── */
.navwrap {
    width: calc(100% - 32px);
    height: 70px;
    background: #6C64FF;
    position: fixed;
    bottom: 16px;
    left: 16px;
    border-radius: 24px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 8px 30px rgba(108,100,255,0.35);
}

.navitem {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 16px;
    transition: background 0.2s;
}

.navitem.active {
    color: #fff;
    background: rgba(255,255,255,0.18);
}

.navitem i {
    font-size: 20px;
    color: rgba(255,255,255,0.65);
}

.navitem.active i { color: #fff; }
</style>
</head>

<body>

<!-- TOP HEADER -->
<div class="top-area">
    <div class="top-content">
        <a href="/profile" style="text-decoration: none; color: inherit; outline: none; -webkit-tap-highlight-color: transparent;">
            <div class="profile-row">
                <i class="fa-solid fa-circle-user" style="font-size: 48px; color: rgba(255,255,255,0.85);"></i>
                <div>
                    <span class="greeting-text" data-en="Good day 👋" data-mr="शुभ दिन 👋">Good day 👋</span>
                    <span id="currentUserName">Loading...</span>
                </div>
            </div>
        </a>

        <div class="top-right">
            <!-- //lang toggle cha button  -->
            <div class="lang-toggle">
                <button class="lang-btn active" id="btn-en" onclick="changeLang('en')">EN</button>
                <button class="lang-btn" id="btn-mr" onclick="changeLang('mr')">मर</button>
            </div>

            <div class="bell-container" onclick="window.location.href='/notifications'">
                <i class="fa-solid fa-bell"></i>
                <span id="notificationDot" class="notification-dot"></span>
            </div>
        </div>
    </div>
</div>

<!-- SEARCH -->
<div class="search-wrapper">
    <div class="search-container">
        <form style="position: relative;">
            <i class="fa-solid fa-magnifying-glass search-icon-fa"></i>
            <input class="search-box"
                   type="search"
                   id="destinationInput"
                   data-en-placeholder="Where are you going?"
                   data-mr-placeholder="तुम्ही कुठे जात आहात?"
                   placeholder="Where are you going?"
                   list="stopsList"
                   autocomplete="off">
            <datalist id="stopsList"></datalist>
        </form>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="white-card">
    <p class="section-label" style="margin-top: 24px;" data-en="Quick Actions" data-mr="द्रुत क्रिया">Quick Actions</p>

    <div class="btn-grid">

        <div class="card-btn half" onclick="window.location.href='/view_ticket'">
            <div class="card-icon-wrap"><i class="fa-solid fa-ticket"></i></div>
            <p class="card-label" data-en="View<br>Ticket" data-mr="तिकीट<br>पहा">View<br>Ticket</p>
        </div>

        <div class="card-btn half" onclick="window.location.href='/view_pass'">
            <div class="card-icon-wrap"><i class="fa-solid fa-id-card"></i></div>
            <p class="card-label" data-en="View<br>Pass" data-mr="पास<br>पहा">View<br>Pass</p>
        </div>

        <div class="card-btn half" onclick="window.location.href='/routestime'">
            <div class="card-icon-wrap"><i class="fa-solid fa-route"></i></div>
            <p class="card-label" data-en="Route<br>Timetables" data-mr="मार्ग<br>वेळापत्रक">Route<br>Timetables</p>
        </div>

        <div class="card-btn half" onclick="handleBuyPassClick()">
            <div class="card-icon-wrap"><i class="fa-solid fa-wallet"></i></div>
            <p class="card-label" data-en="Buy<br>Pass" data-mr="पास<br>खरेदी करा">Buy<br>Pass</p>
        </div>

        <div class="card-btn full-btn tiko-card" onclick="window.location.href='/robo'">
            <div class="card-icon-wrap"><i class="fa-solid fa-robot"></i></div>
            <p class="card-label" data-en="Chat With Tiko" data-mr="टिकोशी बोला">Chat With Tiko</p>
            <span class="tiko-badge" data-en="NEW" data-mr="नवीन">NEW</span>
        </div>
        <div class="card-btn full-btn tiko-card" onclick="window.location.href='/women_safety'">
            <div class="card-icon-wrap"><i class="fa-solid fa-female"></i></div>
            <p class="card-label" data-en="Women<br>Safety" data-mr="महिला<br>सुरक्षा">Women<br>Safety</p>
            <span class="tiko-badge" data-en="NEW" data-mr="नवीन">NEW</span>

</div>
<div style="margin: -4px 16px 16px 16px; border-radius: 22px; overflow: hidden; position: relative; cursor: pointer;"
     onclick="window.location.href='/tourist'">
    <img src="{{ url_for('static', filename='Assets/images/tourism.png') }}"
         style="width: 100%; height: auto; display: block; border-radius: 22px;">
    <div style="position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
                background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.45) 50%, transparent 100%);
                animation: shinePass 2.5s infinite;"></div>
</div>
<!-- NAV BAR -->
<div class="navwrap">

    <div class="navitem active">
        <i class="fa-solid fa-house"></i>
        <div>Home</div>
    </div>

    <a href="/map" style="text-decoration: none; color: inherit;">
        <div class="navitem">
            <i class="fa-solid fa-location-dot"></i>
            <div>Map</div>
        </div>
    </a>

    <a href="/play" style="text-decoration: none; color: inherit; outline: none; -webkit-tap-highlight-color: transparent;">

            <i class="fa-solid fa-gamepad"></i>
            <div>Play</div>
        </div>
    </a>

    <div class="navitem" onclick="window.location.href='/faqs'">
        <i class="fa-solid fa-circle-question"></i>
        <div>FAQs</div>
    </div>

</div>

<!-- ALL ORIGINAL SCRIPTS UNCHANGED -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('Homepage loaded, fetching user...');
    
    fetch('/get_current_user')
        .then(response => response.json())
        .then(result => {
            console.log('User data:', result);
            if (result.success && result.logged_in && result.user) {
                const userNameElement = document.getElementById('currentUserName');
                if (userNameElement) {
                    userNameElement.textContent = result.user.name;
                    console.log('Homepage updated:', result.user.name);
                } else {
                    console.error('currentUserName element not found');
                }
            } else {
                console.log('No user logged in');
            }
        })
        .catch(error => {
            console.error('Error loading user:', error);
        });
});

let isNavigating = false;

document.addEventListener('click', function(e) {
    if (e.target.tagName === 'A' || e.target.closest('a')) {
        const link = e.target.closest('a');
        if (link.href && !link.target) {
            isNavigating = true;
            console.log('Internal navigation detected, will not clear login');
        }
    }
});

window.addEventListener('submit', function() {
    isNavigating = true;
    console.log('Form submission, will not clear login');
});

window.addEventListener('pageshow', function() {
    isNavigating = false;
    console.log('Page shown, reset navigation flag');
});

async function handleBuyPassClick() {
    console.log('Buy Pass button clicked');
    try {
        const response = await fetch('/get_current_user');
        const result = await response.json();
        console.log('Pre-navigation login check:', result);
        if (result.success && result.logged_in) {
            console.log('Navigating to buy_pass page...');
            window.location.href = '/buy_pass';
        } else {
            alert('Please login first.');
            window.location.href = '/';
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
    }
}

async function debugLoginFlow() {
    console.log('=== DEBUG LOGIN FLOW ===');
    try {
        const userResponse = await fetch('/get_current_user');
        const userResult = await userResponse.json();
        console.log('1. Current user:', userResult);
    } catch (error) {
        console.error('User check error:', error);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    console.log('Homepage loaded');
    debugLoginFlow();
});

function checkNotificationStatus() {
    fetch('/check_new_notifications')
        .then(response => response.json())
        .then(data => {
            const dot = document.getElementById('notificationDot');
            if (dot) {
                if (data.success && data.new_notifications) {
                    if (dot.style.display === 'none' || dot.style.display === '') {
                        playBusHorn();
                    }
                    dot.style.display = 'block';
                    console.log('🔔 New notifications available!');
                } else {
                    dot.style.display = 'none';
                }
            }
        })
        .catch(error => console.error('Error checking notifications:', error));
}

function playBusHorn() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        function beep(freq, start, duration, gain) {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(freq, ctx.currentTime + start);
            g.gain.setValueAtTime(gain, ctx.currentTime + start);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
            o.start(ctx.currentTime + start);
            o.stop(ctx.currentTime + start + duration);
        }
        beep(220, 0,    0.18, 0.3);
        beep(180, 0.20, 0.22, 0.25);
        beep(220, 0.44, 0.14, 0.2);
    } catch(e) {}
}

setInterval(checkNotificationStatus, 15000);
checkNotificationStatus();

function updateNotificationCount() {
    fetch('/check_new_notifications')
        .then(response => response.json())
        .then(data => {
            const counter = document.getElementById('notificationCount');
            if (data.success && data.count > 0) {
                counter.textContent = data.count;
                counter.style.display = 'flex';
            } else {
                counter.style.display = 'none';
            }
        })
        .catch(err => console.error(err));
}

setInterval(updateNotificationCount, 5000);
updateNotificationCount();

// Search stops autocomplete
const searchInput = document.getElementById('destinationInput');
const dataList = document.getElementById('stopsList');

searchInput.addEventListener('input', function() {
    const query = this.value.trim();
    if (query.length === 0) {
        dataList.innerHTML = "";
        return;
    }
    fetch(`/search_stops?q=${query}`)
        .then(response => response.json())
        .then(data => {
            dataList.innerHTML = "";
            if (data.success) {
                data.stops.forEach(stop => {
                    const option = document.createElement("option");
                    option.value = stop;
                    dataList.appendChild(option);
                });
            }
        })
        .catch(error => console.error(error));
});

searchInput.addEventListener('change', function() {
    const selected = this.value.trim();
    if (selected) {
        const options = Array.from(dataList.options).map(o => o.value);
        if (options.includes(selected)) {
            window.location.href = `/choose_destination?destination=${encodeURIComponent(selected)}`;
        }
    }
});
</script>

    <!-- // bilungual  -->
<script>
function changeLang(lang) {
    // Update all data-en / data-mr elements (innerHTML to support <br> tags)
    document.querySelectorAll("[data-en]").forEach(el => {
        el.innerHTML = el.getAttribute("data-" + lang);
    });

    // Update search placeholder separately (can't use innerHTML on input)
    const input = document.getElementById('destinationInput');
    if (input) {
        input.placeholder = input.getAttribute("data-" + lang + "-placeholder");
    }

    // Toggle active state on lang buttons
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-mr').classList.toggle('active', lang === 'mr');

    // Remember choice across refreshes
    localStorage.setItem("lang", lang);
}

// On load, restore saved language
(function() {
    const saved = localStorage.getItem("lang");
    if (saved && saved !== 'en') {
        changeLang(saved);
    }
})();
</script>
