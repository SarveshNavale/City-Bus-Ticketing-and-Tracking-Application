<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start Page</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
    background:#1c1c1c;
    padding:15px;
    display:flex;
    justify-content:center;
}

/* ================= LOADER ================= */
.loader{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(8px);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
    animation:hide 0s linear 3s forwards;
}

.spinner{
    width:55px;
    height:55px;
    border:6px solid rgba(255,255,255,0.3);
    border-top:6px solid #6961ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hide{to{visibility:hidden}}

/* ================= LOGO ONLY SCREEN ================= */
.logo-screen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(8px);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:900;
    opacity:0;
    animation:
        showLogo 0s linear 3s forwards,
        hideLogo 0s linear 5s forwards;
}

.logo-screen img{
    width:150px;
}

@keyframes showLogo{to{opacity:1}}
@keyframes hideLogo{to{opacity:0;visibility:hidden}}

/* ================= MAIN PAGE ================= */
.phone{
    width:100%;
    max-width:380px;
    height:800px;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    border:3px solid #0c2c40;
    filter:blur(6px);
    animation:clearPage 0s linear 5s forwards;
}

@keyframes clearPage{to{filter:blur(0)}}

/* TOP */
.top{
    height:70%;
    background:#6961ff;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* RINGS */
.ring{
    position:absolute;
    border-radius:50%;
    opacity:0;
    animation:showContent 0s linear 5s forwards;
}

.ring.left.r1{
    width:140px;height:140px;
    top:-45px;left:-45px;
    border:3px solid transparent;
    border-bottom-color:rgba(255,255,255,0.35);
    border-right-color:rgba(255,255,255,0.35);
}
.ring.left.r2{
    width:110px;height:110px;
    top:-35px;left:-35px;
    border:3px solid transparent;
    border-bottom-color:rgba(255,255,255,0.25);
    border-right-color:rgba(255,255,255,0.25);
}
.ring.left.r3{
    width:80px;height:80px;
    top:-25px;left:-25px;
    border:3px solid transparent;
    border-bottom-color:rgba(255,255,255,0.15);
    border-right-color:rgba(255,255,255,0.15);
}

.ring.right.r1{
    width:140px;height:140px;
    bottom:-45px;right:-45px;
    border:3px solid transparent;
    border-top-color:rgba(255,255,255,0.35);
    border-left-color:rgba(255,255,255,0.35);
}
.ring.right.r2{
    width:110px;height:110px;
    bottom:-35px;right:-35px;
    border:3px solid transparent;
    border-top-color:rgba(255,255,255,0.25);
    border-left-color:rgba(255,255,255,0.25);
}
.ring.right.r3{
    width:80px;height:80px;
    bottom:-25px;right:-25px;
    border:3px solid transparent;
    border-top-color:rgba(255,255,255,0.15);
    border-left-color:rgba(255,255,255,0.15);
}

/* PAGE LOGO */
.page-logo{
    width:150px;
    z-index:5;
}

/* BOTTOM */
.bottom{
    height:30%;
    background:#fff;
    text-align:center;
    padding:25px;
    opacity:0;
    animation:showContent 0s linear 5s forwards;
}

@keyframes showContent{to{opacity:1}}

.bottom h2{
    font-size:26px;
    color:#4a4ac7;
    margin:30px 0 20px;
}

.btn{
    padding:12px 35px;
    background:linear-gradient(to right,#928df8,#3d3bff);
    color:#fff;
    border-radius:25px;
    font-size:17px;
    text-decoration:none;
    display:inline-block;
}
</style>
</head>

<body>

<!-- LOADER -->
<div class="loader">
    <div class="spinner"></div>
</div>

<!-- LOGO ONLY SCREEN -->
<div class="logo-screen">
    <img src="C:\Final year project\rotary-logo.png">
</div>

<!-- MAIN PAGE -->
<div class="phone">
    <div class="top">
        <div class="ring left r1"></div>
        <div class="ring left r2"></div>
        <div class="ring left r3"></div>

        <div class="ring right r1"></div>
        <div class="ring right r2"></div>
        <div class="ring right r3"></div>

        <img src="C:\Final year project\rotary-logo.png" class="page-logo">
    </div>

    <div class="bottom">
        <h2>Smart Travel<br>Made Easy</h2>
        <a href="#" class="btn">Get Started</a>
    </div>
</div>

</body>
</html>
