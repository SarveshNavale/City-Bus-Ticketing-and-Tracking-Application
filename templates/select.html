<!DOCTYPE html>
<html>
<head>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root{
--blue:#6C64FF;
--white:#fff;
--card-bg:#f2f2f2;
--text:#333;
--radius:14px;
--shadow:0 10px 18px rgba(0,0,0,0.12);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Nunito",sans-serif;
background:#fff;
color:var(--text);
}

/* HEADER */
.bluebg{
background:linear-gradient(135deg,#6C64FF 0%,#8B84FF 100%);
height:180px;
width:100%;
position:relative;
overflow:hidden;
}

.circle1{
position:absolute;
width:190px;
height:190px;
border-radius:50%;
background:rgba(255,255,255,0.10);
top:-55px;
right:-45px;
}

.circle2{
position:absolute;
width:115px;
height:115px;
border-radius:50%;
background:rgba(255,255,255,0.07);
top:45px;
right:25px;
}

.backbutton{
position:absolute;
top:45px;
left:20px;
display:flex;
align-items:center;
gap:20px;
}

.backbutton img{
width:60px;
height:60px;
object-fit:contain;
cursor:pointer;
}

/* CONTENT WRAPPER */
.content{
background:var(--white);
margin:-40px auto 0;
border-radius:12px;
padding:25px 18px 40px;
max-width:420px;
}

/* BUTTON CARDS */
.bigwhitebox{
width:100%;
height:80px;
background:var(--card-bg);
border-radius:var(--radius);
margin:15px 0;
box-shadow:var(--shadow);
display:flex;
justify-content:center;
align-items:center;
text-decoration:none;
cursor:pointer;
transition:0.2s;
}

.bigwhitebox:hover{
transform:translateY(-2px);
}

.bigwhitebox p{
font-size:18px;
color:#555;
font-weight:600;
}

</style>

</head>

<body>

<!-- HEADER -->
<div class="bluebg">

    <div class="circle1"></div>
    <div class="circle2"></div>

    <div class="backbutton">
        <img src="static/Assets/images/back-button.png" onclick="window.location.href='/admin_login'">
        <p style="font-size:22px;font-weight:600;color:white;">
            ADMIN <br> PANEL
        </p>
    </div>

</div>

<!-- CONTENT -->
<div class="content">

    <div onclick="window.location.href='/admin_dashboard'" class="bigwhitebox">
        <p>TC Tools</p>
    </div>

    <div onclick="window.location.href='/view_c'" class="bigwhitebox">
        <p>View Complaints</p>
    </div>

    <div onclick="window.location.href='/admin_dashboard_actual'" class="bigwhitebox">
        <p>Dashboard</p>
    </div>

</div>

</body>
</html>
