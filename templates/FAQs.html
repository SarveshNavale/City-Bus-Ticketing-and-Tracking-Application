<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAQs</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #F0F2FF;
    font-family: "Nunito", sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .bluebg {
    background: linear-gradient(135deg, #6C64FF 0%, #8B84FF 100%);
    height: 180px;
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  .circle1 {
    position: absolute;
    width: 190px; height: 190px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    top: -55px; right: -45px;
  }
  .circle2 {
    position: absolute;
    width: 115px; height: 115px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    top: 45px; right: 25px;
  }

  .backbutton {
    position: absolute;
    top: 45px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 49px;
  }

  .backbutton img {
    width: 72px; height: 72px;
    object-fit: contain;
    display: block;
  }

  
  .content {
    margin: -20px 16px 100px 16px;
    position: relative;
    z-index: 10;
  }

  
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  
  .faq-item {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(108,100,255,0.08);
    padding: 18px 18px;
    margin-bottom: 12px;
    animation: slideUp 0.35s ease both;
  }

  .faq-q {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 800;
    color: #333;
    cursor: pointer;
    gap: 12px;
  }

  .faq-q .toggle-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: #F0F2FF;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    color: #6C64FF;
    font-weight: 900;
    transition: background 0.2s, transform 0.2s;
  }

  .faq-q.open .toggle-icon {
    background: #6C64FF;
    color: #fff;
    transform: rotate(45deg);
  }

  .faq-a {
    margin-top: 12px;
    font-size: 13px;
    font-weight: 600;
    color: #777;
    line-height: 1.7;
    display: none;
    padding-top: 10px;
    border-top: 1px dashed #EEEEEE;
  }

  .faq-a.show { display: block; }
  
  /* ── LANGUAGE TOGGLE ── */
.lang-toggle {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.18);
    border-radius: 14px;
    overflow: hidden;
    height: 44px;
    cursor: pointer;
}

.lang-btn {
    padding: 0 13px;
    height: 100%;
    font-size: 12px;
    font-weight: 800;
    color: rgba(255,255,255,0.65);
    background: transparent;
    border: none;
    font-family: "Nunito", sans-serif;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    letter-spacing: 0.3px;
}

.lang-btn.active {
    background: rgba(255,255,255,0.30);
    color: #fff;
}

   /* ── TOP-RIGHT CONTROLS ── */
.top-right {
    display: flex;
    align-items: center;
    gap: 20px;
}
  /* ── NAV BAR ── */
  .navwrap {
    width: calc(100% - 32px);
    height: 70px;
    background: #6C64FF;
    position: fixed;
    bottom: 16px;
    left: 16px;
    border-radius: 24px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 8px 30px rgba(108,100,255,0.35);
    z-index: 999;
  }

  .navitem {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 16px;
    transition: background 0.2s;
  }

  .navitem.active {
    color: #fff;
    background: rgba(255,255,255,0.18);
  }

  .navitem i {
    font-size: 20px;
    color: rgba(255,255,255,0.65);
  }

  .navitem.active i { color: #fff; }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="bluebg">
  <div class="circle1"></div>
  <div class="circle2"></div>

  <a href="/backtohome" style="text-decoration:none;color:inherit;">
    <div class="backbutton">
      <img src="{{ url_for('static', filename='Assets/images/back-button.png') }}">
      <p style="font-size:22px;font-weight:600;color:white;">FAQs</p>
    </div>
  </a>

  <!-- ✅ PROFILE STYLE LANGUAGE TOGGLE -->
   <div class="top-right">
  <div class="top-right-controls" style="position:absolute; top:55px; right:30px; display:flex; align-items:center; gap:10px; z-index:20;">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-en" onclick="changeLang('en')">EN</button>
      <button class="lang-btn" id="btn-mr" onclick="changeLang('mr')">मर</button>
    </div>
  </div>
</div>
</div>

<!-- CONTENT -->
<div class="content">
  <div class="faq-list" id="faqList" style="margin-top: 24px;"></div>
</div>

<!-- NAV BAR -->
<div class="navwrap">

  <a href="/backtohome" style="text-decoration: none; color: inherit;">
    <div class="navitem">
      <i class="fa-solid fa-house"></i>
      <div>Home</div>
    </div>
  </a>

  <a href="/map" style="text-decoration: none; color: inherit;">
    <div class="navitem">
      <i class="fa-solid fa-location-dot"></i>
      <div>Map</div>
    </div>
  </a>

  <a href="/play" style="text-decoration: none; color: inherit;">
    <div class="navitem">
      <i class="fa-solid fa-gamepad"></i>
      <div>Play</div>
    </div>
  </a>

  <div class="navitem active">
    <i class="fa-solid fa-circle-question"></i>
    <div>FAQs</div>
  </div>

</div>

<script>
let currentLang = "en";

const faqs = [
  {
    q: {
      en: "How do I register on the app?",
      mr: "अॅपवर नोंदणी कशी करावी?"
    },
    a: {
      en: "Go to the Registration page, enter your name, age, phone number, email, and password. You can also sign in using Google.",
      mr: "नोंदणी पेजवर जा, तुमचे नाव, वय, मोबाईल नंबर, ईमेल आणि पासवर्ड भरा. तुम्ही Google वापरून साइन इन करू शकता."
    }
  },
  {
    q: {
      en: "How do I login if I already have an account?",
      mr: "माझ्याकडे आधीच अकाउंट असल्यास लॉगिन कसे करावे?"
    },
    a: {
      en: "On the Registration page, tap 'Login' at the bottom and enter your registered phone number or email and password.",
      mr: "नोंदणी पानावर खाली 'लॉगिन' वर टॅप करा आणि तुमचा नोंदणीकृत मोबाईल क्रमांक किंवा ईमेल आणि पासवर्ड टाका."
    }
  },
  {
    q: {
      en: "How do I track a bus location?",
      mr: "बस लोकेशन कशी ट्रॅक करावी?"
    },
    a: {
      en: "Tap 'Track Bus' from the Home Page, select your route, and the app will show live GPS movement of the bus on the map.",
      mr: "मुख्य पानावर 'बस ट्रॅक' वर टॅप करा, तुमचा मार्ग निवडा आणि अ‍ॅप तुम्हाला नकाशावर बसचे लाईव्ह GPS हालचाल दाखवेल."
    }
  },
  {
    q: {
      en: "How do I buy a ticket?",
      mr: "तिकीट कसे खरेदी करावे?"
    },
    a: {
      en: "From the Home Page, select 'Buy Ticket', choose your start stop and destination stop, enter number of tickets, and pay using UPI or card.",
      mr: "मुख्य पानावरून 'तिकीट खरेदी करा' निवडा, तुमचा सुरूवातीचा थांबा निवडा, गंतव्य थांबा निवडा, तिकीटांची संख्या भरा आणि UPI किंवा कार्डद्वारे पेमेंट करा."
    }
  },
    {
  q: {
    en: "Where can I view my purchased tickets?",
    mr: "मी खरेदी केलेली तिकिटे कुठे पाहू शकतो?"
  },
  a: {
    en: "On the Home Page, there is a 'View Ticket' option where you can see all your tickets.",
    mr: "मुख्य पानावर 'तिकीट पाहा' हा पर्याय आहे, तिथे तुम्ही तुमची सर्व तिकिटे पाहू शकता."
  }
},
{
  q: {
    en: "What information is shown on a ticket?",
    mr: "तिकीटावर कोणती माहिती दर्शविली जाते?"
  },
  a: {
    en: "Each ticket includes: From stop, To stop, Number of tickets, Ticket number, Amount paid, Issue date & time, and QR/Barcode for verification.",
    mr: "प्रत्येक तिकीटामध्ये पुढील माहिती असते: सुरूवातीचा थांबा, गंतव्य थांबा, तिकीटांची संख्या, तिकीट क्रमांक, भरलेली रक्कम, जारी तारीख व वेळ आणि पडताळणीसाठी QR/बारकोड."
  }
},
{
  q: {
    en: "How do I buy a pass?",
    mr: "पास कसा खरेदी करायचा?"
  },
  a: {
    en: "From the Home Page, select 'Buy Pass', enter number of members, confirm details, and pay.",
    mr: "मुख्य पानावर 'पास खरेदी करा' निवडा, सदस्यांची संख्या टाका, तपशील तपासा आणि पेमेंट करा."
  }
},
{
  q: {
    en: "How do I view my pass after buying?",
    mr: "खरेदी केल्यानंतर पास कसा पाहायचा?"
  },
  a: {
    en: "On the Home Page, select 'View Pass'. Your active pass will be displayed with pass holder details, validity, and QR code.",
    mr: "मुख्य पानावर 'पास पाहा' हा पर्याय निवडा. तुमचा पास, पास धारकाची माहिती, वैधता आणि QR कोडसह दिसेल."
  }
},
{
  q: {
    en: "What payment methods are supported?",
    mr: "कोणते पेमेंट पद्धती उपलब्ध आहेत?"
  },
  a: {
    en: "UPI, Debit Card, Credit Card, Net Banking, and Wallets are supported.",
    mr: "UPI, डेबिट कार्ड, क्रेडिट कार्ड, नेट बँकिंग आणि वॉलेट्स या पेमेंट पद्धती उपलब्ध आहेत."
  }
},
{
  q: {
    en: "What if payment fails but money is deducted?",
    mr: "पेमेंट फेल झालं पण पैसे कट झाले तर काय करावे?"
  },
  a: {
    en: "Your ticket will auto-generate once payment confirms. If not, the amount will be refunded within 2–5 days.",
    mr: "पेमेंट कन्फर्म झाल्यावर तुमचे तिकीट आपोआप तयार होईल. तसे न झाल्यास, रक्कम 2–5 दिवसांत परत केली जाईल."
  }
},
{
  q: {
    en: "Do I need internet for this app?",
    mr: "हे अ‍ॅप वापरण्यासाठी इंटरनेट आवश्यक आहे का?"
  },
  a: {
    en: "Internet is required for buying tickets, tracking buses, viewing complaints, and updating profile. Downloaded tickets and passes can be shown offline.",
    mr: "तिकीट खरेदी, बस ट्रॅकिंग, तक्रारी पाहणे आणि प्रोफाइल अपडेट करण्यासाठी इंटरनेट आवश्यक आहे. डाउनलोड केलेली तिकिटे आणि पास ऑफलाइन दाखवता येतात."
  }
},
  {
    q: {
      en: "Is my data safe?",
      mr: "माझा डेटा सुरक्षित आहे का?"
    },
    a: {
      en: "Yes, your data is encrypted and securely stored.",
      mr: "हो, तुमचा डेटा सुरक्षित आहे."
    }
  }
];

const faqList = document.getElementById("faqList");

// ✅ render change (only this line change)
function renderFAQs() {
  faqList.innerHTML = "";

  faqs.forEach((item, i) => {
    const box = document.createElement("div");
    box.className = "faq-item";
    box.style.animationDelay = (i * 0.04) + "s";

    box.innerHTML = `
      <div class="faq-q" data-i="${i}">
        <span>${item.q[currentLang]}</span>
        <span class="toggle-icon">+</span>
      </div>
      <div class="faq-a" id="ans-${i}">
        ${item.a[currentLang]}
      </div>
    `;

    faqList.appendChild(box);
  });
}

// toggle same
faqList.addEventListener("click", e => {
  const q = e.target.closest(".faq-q");
  if (!q) return;

  const i = q.dataset.i;
  const ans = document.getElementById("ans-" + i);
  const icon = q.querySelector(".toggle-icon");

  ans.classList.toggle("show");
  q.classList.toggle("open");
  icon.textContent = ans.classList.contains("show") ? "×" : "+";
});

// ✅ same as profile logic
function changeLang(lang) {
  currentLang = lang;

  document.getElementById("btn-en").classList.toggle("active", lang === "en");
  document.getElementById("btn-mr").classList.toggle("active", lang === "mr");

  renderFAQs();
}

// load
renderFAQs();
</script>
</body>
</html>
