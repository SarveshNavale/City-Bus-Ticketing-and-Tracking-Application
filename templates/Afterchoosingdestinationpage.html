<html lang="en">
<head>

<title>Buy Ticket</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.ticket-container {
    margin-top: -40px;
    background: white;
    border-radius: 30px 30px 0 0;
    padding: 30px 20px;
    min-height: 80vh;
    box-shadow: 0 -5px 30px rgba(0,0,0,0.05);
}

.route-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.location h3 {
    margin: 5px 0 0;
    font-weight: 800;
}

.label {
    font-size: 12px;
    color: #888;
}

.route-icon {
    font-size: 20px;
    color: #6C64FF;
}

.fare-section {
    background: #F8F9FF;
    padding: 18px;
    border-radius: 16px;
    margin-bottom: 20px;
}

.fare-section div {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
}

.counter-section {
    margin-bottom: 25px;
}

.counter-box {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-top: 10px;
}

.counter-box button {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: #6C64FF;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.counter-box span {
    font-weight: 800;
    font-size: 18px;
}

.total-section {
    margin-bottom: 25px;
}

.total-section h2 {
    color: #6C64FF;
    margin-top: 5px;
    font-weight: 900;
}

.pay-btn {
    width: 100%;
    padding: 15px;
    border-radius: 18px;
    border: none;
    background: linear-gradient(135deg,#6C64FF,#4A42E8);
    color: white;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(108,100,255,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --purple: #6C64FF;
    --purple-dark: #5A52E0;
    --purple-light: #EAE9FF;
    --text: #2D2D3A;
    --subtext: #888;
    --card: #FFFFFF;
    --bg: #F2F2F7;
}

body {
    font-family: "Nunito", sans-serif;
    background: #F0F2FF;;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
}

.content {
    margin: -28px 16px 100px 16px;
    position: relative;
    z-index: 10;
}

.header-tagline {
    font-size: 23px;
    font-weight: 800;
    color: #333;
    margin: 24px 4px 6px 4px;
    animation: slideUp 0.4s ease both;
}

.section-label {
    font-size: 12px;
    font-weight: 800;
    color: #AAAACC;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 4px 14px 4px;
}

.info-label {
    font-size: 13px;
    color: var(--subtext);
    font-weight: 500;
}

.info-value {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
}

.counter-ctrl {
    display: flex;
    align-items: center;
    gap: 14px;
}

.ctrl-btn:active { transform: scale(0.92); opacity: 0.85; }

.total-amount {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
}

.pay-btn:active { transform: scale(0.98); background: var(--purple-dark); }

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 60, 0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}
.overlay.show { display: flex; }

.overlay-card {
    background: #fff;
    border-radius: 28px;
    padding: 40px 36px;
    text-align: center;
    width: 290px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
}

.spinner {
    width: 64px; height: 64px;
    border: 5px solid var(--purple-light);
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.overlay-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
}
.overlay-sub {
    font-size: 13px;
    color: var(--subtext);
}

.checkmark {
    display: none;
    width: 64px; height: 64px;
    background: #22C55E;
    border-radius: 50%;
    margin: 0 auto 20px;
    align-items: center;
    justify-content: center;
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.checkmark svg { width: 34px; height: 34px; }

.bluebg {

.section-label {
    font-size: 11px;

    margin-bottom: 22px;

.route-row {

.label {

.location h3 {

.info-row div {

}

.counter-box {

.counter-box button {

    border-radius: 50%;

}

.counter-box span {

}

.total-row {
    padding: 18px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.total-row h2 {
    color: #6C64FF;
    font-weight: 900;
}

.pay-btn {
    width: 100%;
    padding: 16px;
    border-radius: 18px;
    border: none;
    background: linear-gradient(135deg,#6C64FF,#4A42E8);
    color: white;

    font-size: 15px;

}

/* ── STOP SEARCH INPUTS (same style as homepage search box) ── */
.stop-search-wrap {
    position: relative;
    width: 100%;
}

.stop-search-input {
    width: 100%;
    height: 48px;
    background: #F0F2FF;
    padding: 0 16px 0 40px;
    border-radius: 14px;
    font-size: 14px;
    color: #444;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    border: 2px solid transparent;
    outline: none;
    transition: border-color 0.2s;
}

.stop-search-input:focus {
    border-color: #6C64FF;
    background: #fff;
}

.stop-search-input::placeholder {
    color: #BBBBCC;
    font-weight: 600;
}

.stop-search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: #6C64FF;
    pointer-events: none;
}

/* dropdown list */
.stop-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(108,100,255,0.18);
    z-index: 50;
    max-height: 200px;
    overflow-y: auto;
    border: 1px solid #EAE9FF;
}

.stop-dropdown.open { display: block; }

.stop-option {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    color: #333;
    cursor: pointer;
    border-bottom: 1px solid #F5F5FF;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s;
}

.stop-option:last-child { border-bottom: none; }

.stop-option:hover, .stop-option.highlighted {
    background: #F0F2FF;
    color: #6C64FF;
}

.stop-option i {
    color: #6C64FF;
    font-size: 13px;

}

.stop-no-result {
    padding: 14px 16px;
    font-size: 13px;

}
</style>
</head>

<body>

<!-- HEADER -->
<div class="bluebg">
  <div class="circle1"></div>
  <div class="circle2"></div>

  <a href="/backtohome" style="text-decoration:none;color:inherit;outline:none;-webkit-tap-highlight-color:transparent;">
    <div class="backbutton">
      <img src="{{ url_for('static', filename='Assets/images/back-button.png') }}">
      <p style="font-size:22px;font-weight:600;color:white;">Buy Ticket</p>
    </div>
  </a>
</div>


<!-- MAIN CARD -->
<div class="content">

    <div class="main-card">

        <p class="header-tagline">Confirm Your Journey</p>
        <p class="section-label">Ticket Details</p>

        <!-- Route Section — now with search inputs -->
        <div class="card-section route-row">

            <!-- FROM stop -->
            <div class="location" style="flex:1;">
                <span class="label">From</span>
                <div class="stop-search-wrap">
                    <i class="fa-solid fa-circle-dot stop-search-icon"></i>
                    <input
                        type="text"
                        id="sourceInput"
                        class="stop-search-input"
                        placeholder="Source stop..."
                        autocomplete="off">
                    <div class="stop-dropdown" id="sourceDropdown"></div>
                </div>
            </div>

            <i class="fa-solid fa-arrow-right route-arrow"></i>

            <!-- TO stop -->
            <div class="location" style="flex:1;">
                <span class="label">To</span>
                <div class="stop-search-wrap">
                    <i class="fa-solid fa-location-dot stop-search-icon"></i>
                    <input
                        type="text"
                        id="destInput"
                        class="stop-search-input"
                        placeholder="Destination stop..."
                        autocomplete="off">
                    <div class="stop-dropdown" id="destDropdown"></div>
                </div>
            </div>

        </div>

        <!-- Fare Section -->
        <div class="card-section info-row">
            <div>
                <span>Fare per ticket</span>
                <strong id="farePerTicket">₹ —</strong>
            </div>
            <div>
                <span>Stops away</span>
                <strong id="stopsCount">—</strong>
            </div>
        </div>

        <!-- Ticket Counter -->
        <div class="card-section counter-row">
            <span>Number of Tickets</span>
            <div class="counter-box">
                <button onclick="dec()">−</button>
                <span id="ticketCount">1</span>
                <button onclick="inc()">+</button>
            </div>
        </div>

        <!-- Total -->
        <div class="total-row">
            <span>Total Amount</span>
            <h2 id="totalAmount">₹ 0.00</h2>
        </div>

        <!-- Pay Button -->
        <button class="pay-btn" onclick="handlePay()">
           Pay Now
        </button>

    </div>

</div>

<!-- PROCESSING OVERLAY -->
<div class="overlay" id="overlay">
    <div class="overlay-card" id="overlayCard">

        <div id="stateProcessing">
            <div class="spinner"></div>
            <div class="overlay-title">Processing Payment…</div>
            <div class="overlay-sub">Please wait, don't go back</div>
        </div>

        <div id="stateSuccess" style="display:none;">
            <div class="checkmark" id="checkmark" style="display:flex;">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>
            <div class="overlay-title">Payment Successful! 🎉</div>
            <div class="overlay-sub">Your ticket has been booked</div>
            <div class="ticket-num-display" id="ticketNumDisplay">TC———</div>
        </div>

    </div>
</div>

<script>
// ════════════════════════════════════════════════
//  STOP SEARCH — reusable for both source & dest
// ════════════════════════════════════════════════

function makeStopSearch(inputId, dropdownId) {
    const input    = document.getElementById(inputId);
    const dropdown = document.getElementById(dropdownId);
    let selectedStop = '';
    let allStops = [];       // cache fetched results
    let activeIndex = -1;    // keyboard nav

    // Pre-fill from URL param if this is the dest field
    if (inputId === 'destInput') {
        const params = new URLSearchParams(window.location.search);
        const pre = params.get('destination');
        if (pre) {
            input.value = pre;
            selectedStop = pre;
        }
    }

    function renderDropdown(stops) {
        dropdown.innerHTML = '';
        activeIndex = -1;

        if (stops.length === 0) {
            dropdown.innerHTML = '<div class="stop-no-result">No stops found</div>';
            dropdown.classList.add('open');
            return;
        }

        stops.forEach((stop, i) => {
            const item = document.createElement('div');
            item.className = 'stop-option';
            item.innerHTML = `<i class="fa-solid fa-bus"></i> ${stop}`;
            item.addEventListener('mousedown', function(e) {
                e.preventDefault(); // don't blur input before click fires
                selectStop(stop);
            });
            dropdown.appendChild(item);
        });

        dropdown.classList.add('open');
        allStops = stops;
    }

    function selectStop(stop) {
        input.value = stop;
        selectedStop = stop;
        dropdown.classList.remove('open');
        dropdown.innerHTML = '';
        recalcFare();   // recalculate fare whenever either stop changes
    }

    function closeDropdown() {
        dropdown.classList.remove('open');
    }

    // Typing → fetch from /search_stops
    input.addEventListener('input', function() {
        const q = this.value.trim();
        selectedStop = '';   // clear until user picks from list

        if (q.length === 0) {
            closeDropdown();
            return;
        }

        fetch(`/search_stops?q=${encodeURIComponent(q)}`)
            .then(r => r.json())
            .then(data => {
                if (data.success && data.stops.length > 0) {
                    renderDropdown(data.stops);
                } else {
                    renderDropdown([]);
                }
            })
            .catch(() => closeDropdown());
    });

    // Keyboard navigation
    input.addEventListener('keydown', function(e) {
        const items = dropdown.querySelectorAll('.stop-option');
        if (!items.length) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = Math.min(activeIndex + 1, items.length - 1);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = Math.max(activeIndex - 1, 0);
        } else if (e.key === 'Enter' && activeIndex >= 0) {
            e.preventDefault();
            selectStop(allStops[activeIndex]);
            return;
        } else if (e.key === 'Escape') {
            closeDropdown();
            return;
        }

        items.forEach((it, i) => {
            it.classList.toggle('highlighted', i === activeIndex);
        });
    });

    // Close on outside click
    document.addEventListener('click', function(e) {
        if (!input.contains(e.target) && !dropdown.contains(e.target)) {
            closeDropdown();
        }
    });

    // Expose getter
    return {
        getStop: () => input.value.trim()   // returns whatever is typed / selected
    };
}

// Initialise both search fields
const sourceSearch = makeStopSearch('sourceInput', 'sourceDropdown');
const destSearch   = makeStopSearch('destInput',   'destDropdown');


// ════════════════════════════════════════════════
//  FARE CALCULATION
// ════════════════════════════════════════════════

let pricePerTicket = 5.00;
let stopsDiff = '—';
async function recalcFare() {
    const src  = sourceSearch.getStop();
    const dest = destSearch.getStop();

    if (!src || !dest || src === dest) {
        document.getElementById('farePerTicket').textContent = '₹ —';
        document.getElementById('stopsCount').textContent = '—';
        pricePerTicket = 0;
        updateTotal();
        return;
    }

    try {
        const res = await fetch(`/get_stops_between?src=${encodeURIComponent(src)}&dest=${encodeURIComponent(dest)}`);
        const data = await res.json();

        if (data.success) {
            stopsDiff = data.stops_diff;
            pricePerTicket = data.fare;
        } else {
            stopsDiff = '—';
            pricePerTicket = 0;
        }
    } catch {
        stopsDiff = '—';
        pricePerTicket = 0;
    }

    document.getElementById('farePerTicket').textContent = '₹ ' + Math.round(pricePerTicket);
    document.getElementById('stopsCount').textContent = stopsDiff;
    updateTotal();
}

// ════════════════════════════════════════════════
//  COUNTER
// ════════════════════════════════════════════════

let count = 1;

function inc() { if (count < 5) { count++; updateTotal(); } }
function dec() { if (count > 1) { count--; updateTotal(); } }

function updateTotal() {
    document.getElementById('ticketCount').textContent = count;
    document.getElementById('totalAmount').textContent = '₹ ' + Math.round(count * pricePerTicket);
}


// ════════════════════════════════════════════════
//  PAY HANDLER
// ════════════════════════════════════════════════

async function handlePay() {
    const src  = sourceSearch.getStop();
    const dest = destSearch.getStop();

    if (!src || !dest) {
        alert('Please select both source and destination stops.');
        return;
    }
    if (src === dest) {
        alert('Source and destination cannot be the same stop.');
        return;
    }

    const overlay = document.getElementById('overlay');
    overlay.classList.add('show');

    await sleep(2200);

    let ticketNumber = 'TC' + Date.now();
    try {
        const res = await fetch('/save_ticket', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                start_dest: src,
                final_dest: dest,
                no_of_tickets: count,
                amount_paid: (count * pricePerTicket).toFixed(2)
            })
        });
        const result = await res.json();
        if (result.success) ticketNumber = result.ticket_number;
    } catch (e) {
        console.error('Save ticket error:', e);
    }

    document.getElementById('stateProcessing').style.display = 'none';
    document.getElementById('stateSuccess').style.display = 'block';
    document.getElementById('ticketNumDisplay').textContent = ticketNumber;

    await sleep(2500);
    window.location.href = '/home';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
