<script>
// ════════════════════════════════════════════════
//  STOP SEARCH — reusable for both source & dest
// ════════════════════════════════════════════════

let sourceTrackNo = null;   // track_no of the chosen source stop
let destTrackNo   = null;   // track_no of the chosen dest stop

function makeStopSearch(inputId, dropdownId, role) {
    // role = 'source' | 'dest'
    const input    = document.getElementById(inputId);
    const dropdown = document.getElementById(dropdownId);
    let allStopNames = [];
    let activeIndex  = -1;

    // Pre-fill destination from URL param
    if (role === 'dest') {
        const params = new URLSearchParams(window.location.search);
        const pre = params.get('destination');
        if (pre) {
            input.value = pre;
            // fetch its track_no so filtering works immediately
            fetch(`/get_track_no?stop=${encodeURIComponent(pre)}`)
                .then(r => r.json())
                .then(d => { if (d.success) destTrackNo = d.track_no; });
        }
    }

    function renderDropdown(stops) {
        dropdown.innerHTML = '';
        activeIndex = -1;

        if (!stops || stops.length === 0) {
            dropdown.innerHTML = '<div class="stop-no-result">No stops found</div>';
            dropdown.classList.add('open');
            allStopNames = [];
            return;
        }

        allStopNames = stops.map(s => s.stop_name);

        stops.forEach((stop, i) => {
            const item = document.createElement('div');
            item.className = 'stop-option';
            item.innerHTML = `<i class="fa-solid fa-bus"></i> ${stop.stop_name}`;
            item.addEventListener('mousedown', function(e) {
                e.preventDefault();
                selectStop(stop.stop_name);
            });
            dropdown.appendChild(item);
        });

        dropdown.classList.add('open');
    }

    function selectStop(stopName) {
        input.value = stopName;
        dropdown.classList.remove('open');
        dropdown.innerHTML = '';

        // Fetch & store this stop's track_no, then recalc fare
        fetch(`/get_track_no?stop=${encodeURIComponent(stopName)}`)
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    if (role === 'source') {
                        sourceTrackNo = d.track_no;
                        // If dest already has a value, re-validate it
                        revalidateOther('dest');
                    } else {
                        destTrackNo = d.track_no;
                        revalidateOther('source');
                    }
                }
                recalcFare();
            });
    }

    // After one side is chosen, re-filter the other side's current typed value
    function revalidateOther(otherRole) {
        const otherId    = otherRole === 'source' ? 'sourceInput' : 'destInput';
        const otherInput = document.getElementById(otherId);
        const q = otherInput.value.trim();
        if (q) {
            fetchStops(q, otherRole === 'source' ? sourceSearch : destSearch, otherRole);
        }
    }

    function fetchStops(q, searchObj, forRole) {
        // Determine which track_no to filter by
        let filterTrack = null;
        if (forRole === 'source' && destTrackNo !== null && destTrackNo !== 0) {
            filterTrack = destTrackNo;
        } else if (forRole === 'dest' && sourceTrackNo !== null && sourceTrackNo !== 0) {
            filterTrack = sourceTrackNo;
        }

        let url = `/search_stops?q=${encodeURIComponent(q)}`;
        if (filterTrack !== null) url += `&track_no=${filterTrack}`;

        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.success) renderDropdown(data.stops);
                else renderDropdown([]);
            })
            .catch(() => closeDropdown());
    }

    function closeDropdown() {
        dropdown.classList.remove('open');
    }

    // Typing handler
    input.addEventListener('input', function() {
        const q = this.value.trim();
        if (role === 'source') sourceTrackNo = null;
        else destTrackNo = null;

        if (q.length === 0) { closeDropdown(); recalcFare(); return; }
        fetchStops(q, null, role);
    });

    // Focus → show suggestions immediately
    input.addEventListener('focus', function() {
        const q = this.value.trim();
        fetchStops(q, null, role);
    });

    // Keyboard navigation
    input.addEventListener('keydown', function(e) {
        const items = dropdown.querySelectorAll('.stop-option');
        if (!items.length) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = Math.min(activeIndex + 1, items.length - 1);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = Math.max(activeIndex - 1, 0);
        } else if (e.key === 'Enter' && activeIndex >= 0) {
            e.preventDefault();
            selectStop(allStopNames[activeIndex]);
            return;
        } else if (e.key === 'Escape') {
            closeDropdown(); return;
        }

        items.forEach((it, i) => it.classList.toggle('highlighted', i === activeIndex));
    });

    // Close on outside click
    document.addEventListener('click', function(e) {
        if (!input.contains(e.target) && !dropdown.contains(e.target)) {
            closeDropdown();
        }
    });

    return {
        getStop: () => input.value.trim()
    };
}

// Initialise both fields
const sourceSearch = makeStopSearch('sourceInput', 'sourceDropdown', 'source');
const destSearch   = makeStopSearch('destInput',   'destDropdown',   'dest');


// ════════════════════════════════════════════════
//  FARE CALCULATION
// ════════════════════════════════════════════════

let pricePerTicket = 0;
let stopsDiff = '—';

async function recalcFare() {
    const src  = sourceSearch.getStop();
    const dest = destSearch.getStop();

    if (!src || !dest || src === dest) {
        document.getElementById('farePerTicket').textContent = '₹ —';
        document.getElementById('stopsCount').textContent = '—';
        pricePerTicket = 0;
        updateTotal();
        return;
    }

    try {
        const res  = await fetch(`/get_stops_between?src=${encodeURIComponent(src)}&dest=${encodeURIComponent(dest)}`);
        const data = await res.json();

        if (data.success) {
            stopsDiff      = data.stops_diff;
            pricePerTicket = data.fare;
        } else {
            stopsDiff      = '—';
            pricePerTicket = 0;
            alert(data.error || 'Could not calculate fare for these stops.');
        }
    } catch {
        stopsDiff      = '—';
        pricePerTicket = 0;
    }

    document.getElementById('farePerTicket').textContent = '₹ ' + Math.round(pricePerTicket);
    document.getElementById('stopsCount').textContent    = stopsDiff;
    updateTotal();
}


// ════════════════════════════════════════════════
//  COUNTER
// ════════════════════════════════════════════════

let count = 1;
function inc() { if (count < 5) { count++; updateTotal(); } }
function dec() { if (count > 1) { count--; updateTotal(); } }

function updateTotal() {
    document.getElementById('ticketCount').textContent  = count;
    document.getElementById('totalAmount').textContent  = '₹ ' + Math.round(count * pricePerTicket);
}


// ════════════════════════════════════════════════
//  PAY HANDLER
// ════════════════════════════════════════════════

async function handlePay() {
    const src  = sourceSearch.getStop();
    const dest = destSearch.getStop();

    if (!src || !dest) {
        alert('Please select both source and destination stops.');
        return;
    }
    if (src === dest) {
        alert('Source and destination cannot be the same stop.');
        return;
    }
    if (pricePerTicket <= 0) {
        alert('Please select valid stops on the same route.');
        return;
    }

    const overlay = document.getElementById('overlay');
    overlay.classList.add('show');

    await sleep(2200);

    let ticketNumber = 'TC' + Date.now();
    try {
        const res = await fetch('/save_ticket', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                start_dest:    src,
                final_dest:    dest,
                no_of_tickets: count,
                amount_paid:   (count * pricePerTicket).toFixed(2)
            })
        });
        const result = await res.json();
        if (result.success) ticketNumber = result.ticket_number;
    } catch (e) {
        console.error('Save ticket error:', e);
    }

    document.getElementById('stateProcessing').style.display = 'none';
    document.getElementById('stateSuccess').style.display    = 'block';
    document.getElementById('ticketNumDisplay').textContent  = ticketNumber;

    await sleep(2500);
    window.location.href = '/home';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }


// ════════════════════════════════════════════════
//  LANGUAGE TOGGLE
// ════════════════════════════════════════════════

function changeLang(lang) {
    document.querySelectorAll("[data-en]").forEach(el => {
        el.innerHTML = el.getAttribute("data-" + lang);
    });
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-mr').classList.toggle('active', lang === 'mr');
    localStorage.setItem("lang", lang);
}

(function() {
    const saved = localStorage.getItem("lang") || "en";
    changeLang(saved);
})();
</script>
