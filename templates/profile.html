<!DOCTYPE html>
<html>
<head>
<title>Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Nunito", sans-serif;
    background: #F0F2FF;
    min-height: 100vh;
}

/* ── HEADER ── */
.bluebg {
    background: linear-gradient(135deg, #6C64FF 0%, #8B84FF 100%);
    height: 220px;
    width: 100%;
    position: relative;
    overflow: hidden;
}

.circle1 {
    position: absolute;
    width: 190px; height: 190px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    top: -55px; right: -45px;
}
.circle2 {
    position: absolute;
    width: 115px; height: 115px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    top: 45px; right: 25px;
}

.backbutton {
    position: absolute;
    top: 45px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 49px;
}

.backbutton img {
    width: 42px; height: 42px;
    object-fit: contain;
    display: block;
}

.settings-button {
    position: absolute;
    right: 20px;
    top: 48px;
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.18);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.settings-button i {
    font-size: 18px;
    color: #fff;
}

/* ── AVATAR ── */
.avatar-wrap {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 80px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 4px 20px rgba(108,100,255,0.20);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
}

.avatar-wrap i {
    font-size: 52px;
    color: #6C64FF;
}

/* ── CONTENT ── */
.content {
    margin: 56px 16px 40px 16px;
    position: relative;
    z-index: 10;
}

/* Username centered */
#profileUserName {
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    color: #333;
    margin-bottom: 22px;
}

/* ── PROFILE CARD ── */
.profile-card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 4px 18px rgba(108,100,255,0.10);
    padding: 22px 20px;
    margin-bottom: 14px;
}

.field-row {
    margin-bottom: 18px;
}

.field-row:last-child { margin-bottom: 0; }

.field-label {
    font-size: 11px;
    font-weight: 800;
    color: #AAAACC;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.edit-btn {
    font-size: 12px;
    font-weight: 800;
    color: #6C64FF;
    cursor: pointer;
    background: #F0F2FF;
    padding: 2px 10px;
    border-radius: 20px;
    text-transform: none;
    letter-spacing: 0;
}

.field-input {
    width: 100%;
    height: 48px;
    background: #F0F2FF;
    border: none;
    border-radius: 14px;
    padding: 0 16px;
    font-size: 15px;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    color: #333;
    outline: none;
}

.field-input:disabled {
    background: #F0F2FF;
    color: #555;
}

.field-input:focus {
    box-shadow: 0 0 0 3px rgba(108,100,255,0.18);
}

/* ── AD BOX ── */
.advertise-card {
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 4px 18px rgba(108,100,255,0.10);
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #CCC;
    margin-bottom: 40px;
}

.advertise-card i { font-size: 24px; color: #DDD; }
.advertise-card p { font-size: 14px; font-weight: 800; color: #CCCCCC; }
</style>
</head>

<body>

<!-- HEADER -->
<div class="bluebg">
    <div class="circle1"></div>
    <div class="circle2"></div>

    <a href="/home" style="text-decoration:none;color:inherit;outline:none;-webkit-tap-highlight-color:transparent;">
        <div class="backbutton">
            <img src="static/Assets/images/back-button.png" alt="Back">
            <p style="font-size:22px;font-weight:600;color:white;">Profile</p>
        </div>
    </a>

    <div class="settings-button" onclick="window.location.href='/complaints'">
        <i class="fa-solid fa-gear"></i>
    </div>

    <div class="avatar-wrap">
        <i class="fa-solid fa-circle-user"></i>
    </div>
</div>

<!-- CONTENT -->
<div class="content">

    <p id="profileUserName">Loading...</p>

    <div class="profile-card">

        <!-- NAME -->
        <div class="field-row">
            <div class="field-label">
                <span>Name</span>
                <span class="edit-btn">✎ Edit</span>
            </div>
            <input class="field-input" id="inputName" type="text" value="Loading..." disabled>
        </div>

        <!-- AGE -->
        <div class="field-row">
            <div class="field-label">
                <span>Age</span>
                <span class="edit-btn">✎ Edit</span>
            </div>
            <input class="field-input" id="inputAge" type="number" value="0" disabled>
        </div>

        <!-- MOBILE -->
        <div class="field-row">
            <div class="field-label">
                <span>Mobile Number</span>
                <span class="edit-btn">✎ Edit</span>
            </div>
            <input class="field-input" id="inputMobile" type="text" value="Loading..." disabled>
        </div>

        <!-- EMAIL -->
        <div class="field-row">
            <div class="field-label">
                <span>Email</span>
                <span class="edit-btn">✎ Edit</span>
            </div>
            <input class="field-input" id="inputEmail" type="text" value="Loading..." disabled>
        </div>

    </div>

    <!-- AD BOX -->
    <div class="advertise-card">
        <i class="fa-regular fa-rectangle-ad"></i>
        <p>Advertise Here</p>
    </div>

</div>

<!-- ALL ORIGINAL SCRIPTS UNCHANGED -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('Profile page loaded');
    
    document.getElementById('profileUserName').textContent = 'Loading...';
    document.getElementById('inputName').value = 'Loading...';
    document.getElementById('inputAge').value = 'Loading...';
    document.getElementById('inputMobile').value = 'Loading...';
    document.getElementById('inputEmail').value = 'Loading...';
    
    setTimeout(loadUserProfile, 500);
});

function loadUserProfile() {
    console.log('Fetching user profile...');
    
    fetch('/get_current_user')
        .then(response => {
            console.log('Response status:', response.status);
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(result => {
            console.log('Server response:', result);
            
            if (result.success && result.logged_in && result.user) {
                console.log('User data received:', result.user);
                updateProfileFields(result.user);
            } else {
                console.log('No user logged in:', result.error);
                handleNoUser();
            }
        })
        .catch(error => {
            console.error('Fetch error:', error);
            handleError();
        });
}

function updateProfileFields(user) {
    console.log('Updating profile fields with:', user);
    
    try {
        const elements = {
            'profileUserName': user.name,
            'inputName': user.name,
            'inputAge': user.age,
            'inputMobile': user.mobile,
            'inputEmail': user.email
        };
        
        for (const [id, value] of Object.entries(elements)) {
            const element = document.getElementById(id);
            if (element) {
                if (element.tagName === 'INPUT') {
                    element.value = value;
                } else {
                    element.textContent = value;
                }
                console.log(`   Updated ${id}: ${value}`);
            } else {
                console.error(`   Element not found: ${id}`);
            }
        }
        
        console.log('Profile updated successfully');
    } catch (error) {
        console.error('Error updating fields:', error);
    }
}

function handleNoUser() {
    console.log('No user logged in, redirecting to login...');
    alert('Please login to view your profile');
    
    setTimeout(() => {
        window.location.href = '/';
    }, 1000);
}

function handleError() {
    console.log('Error loading profile');
    
    setTimeout(() => {
        console.log('Retrying...');
        loadUserProfile();
    }, 2000);
}

document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
        console.log('Page became visible, refreshing profile');
        loadUserProfile();
    }
});

window.addEventListener('beforeunload', function(event) {
    if (isNavigating) {
        console.log('Page navigation, NOT clearing login');
        return; 
    }
    
    console.log('Window actually closing, clearing login...');
    
    if (navigator.sendBeacon) {
        navigator.sendBeacon('/clear_login');
        console.log('Login cleared via sendBeacon');
    } else {
        fetch('/clear_login', {
            method: 'POST',
            keepalive: true
        });
    }
});
</script>
</body>
</html>
