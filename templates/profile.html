<!DOCTYPE html>
<html>
<head>
<title>Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Nunito", sans-serif;
    background: #F0F2FF;
    min-height: 100vh;
}

/* ── HEADER ── */
.bluebg {
    background: linear-gradient(135deg, #6C64FF 0%, #8B84FF 100%);
    height: 180px;
    width: 100%;
    position: relative;
    overflow: hidden;
    z-index: 10;
}

.backbutton {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    outline: none;
    -webkit-tap-highlight-color: transparent;
}

.backbutton img {
    width: 32px; height: 32px;
    object-fit: contain;
    display: block;
}

/* ── TOP RIGHT CONTROLS ── */
.top-right-controls {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
}

/* ── LANGUAGE TOGGLE ── */
.lang-toggle {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.18);
    border-radius: 12px;
    overflow: hidden;
    height: 36px;
}

.lang-btn {
    padding: 0 12px;
    height: 100%;
    font-size: 12px;
    font-weight: 800;
    color: rgba(255,255,255,0.65);
    background: transparent;
    border: none;
    font-family: "Nunito", sans-serif;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    letter-spacing: 0.3px;
}

.lang-btn.active {
    background: rgba(255,255,255,0.30);
    color: #fff;
}

.settings-button {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.18);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.settings-button i {
    font-size: 17px;
    color: #fff;
}

/* ── AVATAR SECTION ── */
.avatar-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 28px;
    padding-bottom: 8px;
}

.avatar-wrap {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 4px 22px rgba(108,100,255,0.22);
    display: flex;
    align-items: center;
    justify-content: center;
}

.avatar-wrap i {
    font-size: 58px;
    color: #6C64FF;
    line-height: 1;
}

/* ── CONTENT ── */
.content {
    margin: 0 16px 40px 16px;
}

#profileUserName {
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    color: #333;
    margin-bottom: 22px;
    margin-top: 10px;
}

/* ── PROFILE CARD ── */
.profile-card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 4px 18px rgba(108,100,255,0.10);
    padding: 22px 20px;
    margin-bottom: 14px;
}

.field-row { margin-bottom: 18px; }
.field-row:last-child { margin-bottom: 0; }

.field-label {
    font-size: 11px;
    font-weight: 800;
    color: #AAAACC;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.edit-btn {
    font-size: 12px;
    font-weight: 800;
    color: #6C64FF;
    cursor: pointer;
    background: #F0F2FF;
    padding: 2px 10px;
    border-radius: 20px;
    text-transform: none;
    letter-spacing: 0;
}

.field-input {
    width: 100%;
    height: 48px;
    background: #F0F2FF;
    border: none;
    border-radius: 14px;
    padding: 0 16px;
    font-size: 15px;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    color: #333;
    outline: none;
}

.field-input:disabled { background: #F0F2FF; color: #555; }
.field-input:focus { box-shadow: 0 0 0 3px rgba(108,100,255,0.18); }

/* ── AD BOX ── */
.advertise-card {
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 4px 18px rgba(108,100,255,0.10);
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 40px;
}

.advertise-card i { font-size: 24px; color: #DDD; }
.advertise-card p { font-size: 14px; font-weight: 800; color: #CCCCCC; }

/* ── SETTINGS POPUP OVERLAY ── */
.popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
}

.popup-overlay.show { display: flex; }

.popup-sheet {
    background: #fff;
    border-radius: 28px 28px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 20px 20px 40px 20px;
    animation: slideUpSheet 0.25s ease;
}

@keyframes slideUpSheet {
    from { transform: translateY(100%); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
}

.popup-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.popup-title {
    font-size: 13px;
    font-weight: 800;
    color: #AAAACC;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.popup-close {
    width: 32px; height: 32px;
    background: #F0F2FF;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 15px;
    color: #888;
    border: none;
    font-family: "Nunito", sans-serif;
    font-weight: 800;
}

.popup-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: #F0F2FF;
    border-radius: 18px;
    cursor: pointer;
    margin-bottom: 10px;
    transition: background 0.15s;
    text-decoration: none;
}

.popup-item:active { background: #E4E6FF; }

.popup-item-icon {
    width: 42px; height: 42px;
    background: #fff;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #6C64FF;
    flex-shrink: 0;
}

.popup-item-text {
    font-size: 15px;
    font-weight: 800;
    color: #333;
}

.popup-item-sub {
    font-size: 12px;
    font-weight: 600;
    color: #AAAACC;
    margin-top: 2px;
}

.popup-divider {
    height: 1px;
    background: #EBEBF5;
    margin: 2px 0 12px 0;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="bluebg">
    <a href="/home" class="backbutton">
        <img src="static/Assets/images/back-button.png" alt="Back">
        <p style="font-size:20px;font-weight:700;color:white;">Profile</p>
    </a>

    <div class="top-right-controls">
        <div class="lang-toggle">
            <button class="lang-btn active" id="btn-en" onclick="changeLang('en')">EN</button>
            <button class="lang-btn" id="btn-mr" onclick="changeLang('mr')">मर</button>
        </div>
        <div class="settings-button" onclick="openSettingsPopup()">
            <i class="fa-solid fa-gear"></i>
        </div>
    </div>
</div>

<!-- AVATAR (outside bluebg so it's fully visible) -->
<div class="avatar-section">
    <div class="avatar-wrap">
        <i class="fa-solid fa-circle-user"></i>
    </div>
</div>

<!-- CONTENT -->
<div class="content">

    <p id="profileUserName">Loading...</p>

    <div class="profile-card">

        <!-- NAME -->
        <div class="field-row">
            <div class="field-label">
                <span data-en="Name" data-mr="नाव">Name</span>
                <span class="edit-btn" data-en="✎ Edit" data-mr="✎ संपादित करा">✎ Edit</span>
            </div>
            <input class="field-input" id="inputName" type="text" value="Loading..." disabled>
        </div>

        <!-- AGE -->
        <div class="field-row">
            <div class="field-label">
                <span data-en="Age" data-mr="वय">Age</span>
                <span class="edit-btn" data-en="✎ Edit" data-mr="✎ संपादित करा">✎ Edit</span>
            </div>
            <input class="field-input" id="inputAge" type="number" value="0" disabled>
        </div>

        <!-- MOBILE -->
        <div class="field-row">
            <div class="field-label">
                <span data-en="Mobile Number" data-mr="मोबाईल नंबर">Mobile Number</span>
                <span class="edit-btn" data-en="✎ Edit" data-mr="✎ संपादित करा">✎ Edit</span>
            </div>
            <input class="field-input" id="inputMobile" type="text" value="Loading..." disabled>
        </div>

        <!-- EMAIL -->
        <div class="field-row">
            <div class="field-label">
                <span data-en="Email" data-mr="ईमेल">Email</span>
                <span class="edit-btn" data-en="✎ Edit" data-mr="✎ संपादित करा">✎ Edit</span>
            </div>
            <input class="field-input" id="inputEmail" type="text" value="Loading..." disabled>
        </div>

    </div>

    <!-- AD BOX -->
    <div class="advertise-card">
        <i class="fa-regular fa-rectangle-ad"></i>
        <p>Advertise Here</p>
    </div>

</div>

<!-- ── SETTINGS POPUP ── -->
<div class="popup-overlay" id="settingsPopup" onclick="handleOverlayClick(event)">
    <div class="popup-sheet">

        <div class="popup-header">
            <span class="popup-title">Settings</span>
            <button class="popup-close" onclick="closeSettingsPopup()">✕</button>
        </div>

        <!-- Complaints -->
        <a href="/complaints" class="popup-item">
            <div class="popup-item-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div>
                <div class="popup-item-text">Complaints</div>
                <div class="popup-item-sub">Report an issue</div>
            </div>
        </a>

        <div class="popup-divider"></div>

        <!-- About us -->
        <a href="/about_us" class="popup-item">
            <div class="popup-item-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div>
                <div class="popup-item-text">About us</div>
                <div class="popup-item-sub">Learn more about our system</div>
            </div>
        </a>

        <div class="popup-divider"></div>
   
         <!-- customer helpline -->
        <a href="/customer_helpline" class="popup-item">
            <div class="popup-item-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div>
                <div class="popup-item-text">customer helpline</div>
                <div class="popup-item-sub">Get help and support</div>
            </div>
        </a>

        <div class="popup-divider"></div>

        
        

    </div>
</div>

<!-- ALL ORIGINAL SCRIPTS UNCHANGED -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('Profile page loaded');
    document.getElementById('profileUserName').textContent = 'Loading...';
    document.getElementById('inputName').value = 'Loading...';
    document.getElementById('inputAge').value = 'Loading...';
    document.getElementById('inputMobile').value = 'Loading...';
    document.getElementById('inputEmail').value = 'Loading...';
    setTimeout(loadUserProfile, 500);
});

function loadUserProfile() {
    console.log('Fetching user profile...');
    fetch('/get_current_user')
        .then(response => {
            console.log('Response status:', response.status);
            if (!response.ok) throw new Error('Network response was not ok');
            return response.json();
        })
        .then(result => {
            console.log('Server response:', result);
            if (result.success && result.logged_in && result.user) {
                console.log('User data received:', result.user);
                updateProfileFields(result.user);
            } else {
                console.log('No user logged in:', result.error);
                handleNoUser();
            }
        })
        .catch(error => {
            console.error('Fetch error:', error);
            handleError();
        });
}

function updateProfileFields(user) {
    console.log('Updating profile fields with:', user);
    try {
        const elements = {
            'profileUserName': user.name,
            'inputName': user.name,
            'inputAge': user.age,
            'inputMobile': user.mobile,
            'inputEmail': user.email
        };
        for (const [id, value] of Object.entries(elements)) {
            const element = document.getElementById(id);
            if (element) {
                if (element.tagName === 'INPUT') { element.value = value; }
                else { element.textContent = value; }
                console.log(`   Updated ${id}: ${value}`);
            } else {
                console.error(`   Element not found: ${id}`);
            }
        }
        console.log('Profile updated successfully');
    } catch (error) {
        console.error('Error updating fields:', error);
    }
}

function handleNoUser() {
    console.log('No user logged in, redirecting to login...');
    alert('Please login to view your profile');
    setTimeout(() => { window.location.href = '/'; }, 1000);
}

function handleError() {
    console.log('Error loading profile');
    setTimeout(() => { console.log('Retrying...'); loadUserProfile(); }, 2000);
}

document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
        console.log('Page became visible, refreshing profile');
        loadUserProfile();
    }
});

window.addEventListener('beforeunload', function(event) {
    if (isNavigating) { console.log('Page navigation, NOT clearing login'); return; }
    console.log('Window actually closing, clearing login...');
    if (navigator.sendBeacon) {
        navigator.sendBeacon('/clear_login');
        console.log('Login cleared via sendBeacon');
    } else {
        fetch('/clear_login', { method: 'POST', keepalive: true });
    }
});
</script>

<!-- ── POPUP SCRIPT ── -->
<script>
function openSettingsPopup() {
    document.getElementById('settingsPopup').classList.add('show');
}
function closeSettingsPopup() {
    document.getElementById('settingsPopup').classList.remove('show');
}
function handleOverlayClick(e) {
    if (e.target === document.getElementById('settingsPopup')) {
        closeSettingsPopup();
    }
}
</script>

<!-- ── BILINGUAL SCRIPT ── -->
<script>
function changeLang(lang) {
    document.querySelectorAll("[data-en]").forEach(el => {
        el.innerHTML = el.getAttribute("data-" + lang);
    });
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-mr').classList.toggle('active', lang === 'mr');
    localStorage.setItem("lang", lang);
}

(function() {
    const saved = localStorage.getItem("lang");
    if (saved && saved !== 'en') { changeLang(saved); }
})();
</script>

</body>
</html>
