<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --blue:#6C64FF;
      --white:#fff;
      --card-bg:#f2f2f2;
      --text:#333;
      --radius:14px;
      --shadow:0 10px 18px rgba(0,0,0,0.12);
    }

    *{margin:0;padding:0;box-sizing:border-box}

    body{
      background:#fff;
      font-family:"Poppins",sans-serif;
      color:var(--text);
    }

    /* header */
    .bluebg {
    background-color: #6C64FF;
    height: 220px;
    width: 100%;
    position: relative;
}

.backbutton {
    position: absolute;
    top: 45px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 49px;
}

.backbutton img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: flaot;   /* 🔒 kept same */
}

.topcircles {
    position: absolute;
    right: 5px;
    top: 0px;
}


    /* content area */
    .content{
  background:var(--white);
  margin:-28px auto 0;   /* center */
  border-radius:12px;
  padding:28px 18px 40px;
  max-width:420px;       /* card center */
}


    .card{
      background:var(--card-bg);
      border-radius:var(--radius);
      padding:24px;
      box-shadow:var(--shadow);
    }

    .title{
      text-align:center;
      font-size:20px;
      font-weight:600;
      margin-bottom:20px;
    }

    .field{
      margin-bottom:16px;
    }

    .field label{
      font-size:14px;
      color:#555;
      display:block;
      margin-bottom:6px;
    }

    .field input{
      width:100%;
      padding:12px;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:15px;
    }

    .login-btn{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      background:var(--blue);
      color:#fff;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
    }

    .login-btn:hover{
      opacity:0.95;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="bluebg">
    <a href="/backtohome" style="text-decoration: none; color: inherit; outline: none; -webkit-tap-highlight-color: transparent;">
    <div class="backbutton">
        <img src="{{ url_for('static', filename='Assets/images/back-button.png') }}">
        <p style="font-size: 22px; font-family: 'Hind Guntur'; font-weight:600; color:white;"> Admin <br> login</p>
    </div>
    </a>

    <div class="topcircles">
        <img src="{{ url_for('static', filename='Assets/images/Just-circles.png') }}" style="width:150px;">
    </div>

</div>

  <!-- CONTENT -->
  <div class="content">
    <div class="card">

      <div class="title"></div>

      <form method="POST" action="/admin_login">

    <div class="field">
        <label>Admin ID</label>
        <input type="text" name="admin_id" required>
    </div>

    <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
    </div>

    <button type="submit" class="login-btn">Login</button>


      </form>

    </div>
  </div>

</body>
</html>
